[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto
markers =
    unit: Testes unitários
    integration: Testes de integração
    contract: Testes de contrato
asyncio_mode = auto
