[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-hive-exceptions"
version = "1.0.0"
description = "Centralized exception library for Neural Hive-Mind platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Neural Hive-Mind Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "grpcio>=1.68.0",
]

[project.urls]
Homepage = "https://github.com/albinoJimy/Neural-Hive-Mind"
Repository = "https://github.com/albinoJimy/Neural-Hive-Mind"
