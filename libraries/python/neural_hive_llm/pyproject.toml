[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-hive-llm"
version = "1.0.0"
description = "Biblioteca Neural Hive-Mind para clientes LLM centralizados"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Neural Hive-Mind Team", email = "dev@neuralhive-mind.com"},
]
keywords = ["llm", "openai", "anthropic", "ollama", "ai", "neural-hive-mind"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Neural Hive-Mind libraries
    "neural-hive-resilience>=2.0.0",
    "neural-hive-observability>=2.0.0",
    # Pydantic
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Async HTTP
    "httpx>=0.28.0",
    # Retry
    "tenacity>=8.0",
    # Logging
    "structlog>=24.0",
    # Metrics
    "prometheus-client>=0.20",
    # Optional - OpenAI SDK
    "openai>=1.40.0; extra == 'openai'",
    # Optional - Anthropic SDK
    "anthropic>=0.40.0; extra == 'anthropic'",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.40.0"]
all = ["openai>=1.40.0", "anthropic>=0.40.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",  # Para mock HTTP
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-httpx>=0.45b0",
]

[project.urls]
Homepage = "https://github.com/albinoJimy/Neural-Hive-Mind"
Documentation = "https://github.com/albinoJimy/Neural-Hive-Mind/tree/main/libraries/python/neural_hive_llm"
Repository = "https://github.com/albinoJimy/Neural-Hive-Mind.git"
Issues = "https://github.com/albinoJimy/Neural-Hive-Mind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_hive_llm*"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: Marca testes de integração que requerem APIs reais",
    "unit: Marca testes unitários que usam mocks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["neural_hive_llm"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstract",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["neural_hive_llm", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["neural_hive_llm"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
