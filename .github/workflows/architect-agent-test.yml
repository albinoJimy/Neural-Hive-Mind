name: Test Architect Agent

on:
  push:
    branches: [main, staging]
    paths:
      - 'services/architect-agent/**'
      - '.github/workflows/architect-agent-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/architect-agent/**'
      - '.github/workflows/architect-agent-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'services/architect-agent/requirements*.txt'

    - name: Install dependencies
      working-directory: ./services/architect-agent
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linter
      working-directory: ./services/architect-agent
      run: ruff check .

    - name: Run formatter check
      working-directory: ./services/architect-agent
      run: black --check .

    - name: Run type checker
      working-directory: ./services/architect-agent
      run: mypy src/ --ignore-missing-imports
      continue-on-error: true

    - name: Run unit tests
      working-directory: ./services/architect-agent
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/unit/ -v --tb=short

    - name: Run integration tests
      working-directory: ./services/architect-agent
      env:
        MONGODB_URL: mongodb://localhost:27017/test
      run: |
        pytest tests/integration/ -v --tb=short -m integration
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: ./services/architect-agent
      run: |
        docker build -t nhm/architect-agent:test .
