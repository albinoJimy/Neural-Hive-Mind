name: Test Coverage Enforcement

# Executa testes com verificação de cobertura mínima de 70%
# Falha o build se cobertura estiver abaixo do limite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  MINIMUM_COVERAGE: 70
  PYTHON_VERSION: "3.12"

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-runner:
    name: Select Runner with Auto Fallback
    uses: ./.github/workflows/_runner-select.yml
    secrets: inherit

  unit-tests:
    name: Unit Tests with Coverage
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.selected-runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          pip install pytest-aiohttp pytest-grpc pytest-timeout
          pip install -r requirements-base.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --cov=services \
            --cov=libraries \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-unit \
            --cov-fail-under=${{ env.MINIMUM_COVERAGE }} \
            --verbose \
            --tb=short \
            | tee coverage-unit.log

      - name: Generate coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep "TOTAL" coverage-unit.log || echo "Coverage not available"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false

      - name: Archive coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-unit
          path: |
            coverage.xml
            htmlcov-unit/
            coverage-unit.log
          retention-days: 30

  integration-tests:
    name: Integration Tests with Coverage
    needs: [select-runner, unit-tests]
    runs-on: ${{ needs.select-runner.outputs.selected-runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements-base.txt

      - name: Start infrastructure (Docker Compose)
        run: |
          docker-compose -f docker-compose-test.yml up -d
          timeout 120 bash -c "until docker-compose ps | grep -q 'Up'; do sleep 2; done"

      - name: Run integration tests with coverage
        run: |
          pytest tests/integration \
            --cov=services \
            --cov-append \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-integration \
            --verbose \
            --tb=short \
            | tee coverage-integration.log

      - name: Stop infrastructure
        if: always()
        run: docker-compose -f docker-compose-test.yml down -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-coverage

      - name: Archive coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-integration
          path: |
            coverage.xml
            htmlcov-integration/
            coverage-integration.log
          retention-days: 30

  coverage-report:
    name: Generate Coverage Report
    needs: [select-runner, unit-tests, integration-tests]
    runs-on: ${{ needs.select-runner.outputs.selected-runner }}
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage tools
        run: |
          pip install coverage coverage-conditional-plugin

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-reports-*
          merge-multiple: true

      - name: Combine coverage reports
        run: |
          coverage combine coverage-*.xml
          coverage xml -o coverage-combined.xml
          coverage report --fail-under=${{ env.MINIMUM_COVERAGE }}

      - name: Generate coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.GITHUB_TOKEN }}
          MINIMUM_GREEN: ${{ env.MINIMUM_COVERAGE }}
          COVERAGE_FILE: coverage-combined.xml

      - name: PR comment with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage-comment.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverage
            });

  coverage-check:
    name: Check Minimum Coverage
    needs: [select-runner, unit-tests, integration-tests]
    runs-on: ${{ needs.select-runner.outputs.selected-runner }}
    if: always()

    steps:
      - name: Check coverage status
        run: |
          echo "Checking if coverage meets minimum threshold..."
          echo "Required: ${{ env.MINIMUM_COVERAGE }}%"

          # Check unit tests
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then
            echo "❌ Unit tests failed coverage check"
            exit 1
          fi

          # Check integration tests
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "⚠️ Integration tests failed (but may be acceptable)"
          fi

          echo "✅ Coverage check passed!"

      - name: Create coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          COLOR="red"
          if (( $(echo "$COVERAGE >= 70" | bc -l) )); then
            COLOR="yellow"
          fi
          if (( $(echo "$COVERAGE >= 85" | bc -l) )); then
            COLOR="green"
          fi
          echo "Badge: coverage-${COLOR}"
