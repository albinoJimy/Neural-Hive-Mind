name: Security Scan

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  bandit-scan:
    name: Bandit Python Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: |
          pip install bandit[toml]

      - name: Run Bandit on Fluxo G services
        run: |
          # Scan each service directory
          for service in requirements-engineering documentation-generation knowledge-graph-rag approval-gateway service-registry orchestrator-dynamic; do
            echo "Scanning $service..."
            if [ -d "services/$service/src" ]; then
              bandit -r "services/$service/src" \
                -f json \
                -o "bandit_${service}_report.json" \
                -ll || true
            fi
          done

      - name: Generate summary
        if: always()
        run: |
          echo "# Bandit Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Issues | High | Medium | Low |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|------|--------|-----|" >> $GITHUB_STEP_SUMMARY

          for service in requirements-engineering documentation-generation knowledge-graph-rag approval-gateway service-registry orchestrator-dynamic; do
            if [ -f "bandit_${service}_report.json" ]; then
              high=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit_${service}_report.json || echo "0")
              medium=$(jq '[.results[] | select(.issue_severity == "MEDIUM")] | length' bandit_${service}_report.json || echo "0")
              low=$(jq '[.results[] | select(.issue_severity == "LOW")] | length' bandit_${service}_report.json || echo "0")
              total=$((high + medium + low))
              echo "| $service | $total | $high | $medium | $low |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: bandit_*_report.json
          retention-days: 30

  trivy-scan:
    name: Trivy Container & Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
