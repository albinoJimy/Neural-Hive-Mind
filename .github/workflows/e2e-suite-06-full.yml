name: E2E Suite 06 - Full Pipeline Smoke

description: Minimal smoke tests for complete intent-to-code flow (critical path only)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 AM UTC

jobs:
  full-pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r tests/requirements-test.txt
          pip install -e libraries/python/neural_hive_resilience
          pip install -e libraries/security
          pip install -e libraries/python/neural_hive_ml
          pip install -e libraries/neural_hive_integration
          pip install -e libraries/python/neural_hive_specialists

      - name: Run Critical Path Smoke Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/e2e/test_02_happy_path.py \
            -v \
            --tb=short \
            -m "smoke and critical" \
            --junit-xml=tests/results/smoke-test-junit.xml \
            --log-cli-level=INFO \
            --maxfail=3
        timeout-minutes: 15

      - name: Run Full Intent to Code Flow (Smoke)
        env:
          MONGODB_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/e2e/test_full_intent_to_code.py \
            -v \
            --tb=short \
            -m "smoke" \
            --junit-xml=tests/results/full-flow-smoke-junit.xml \
            --log-cli-level=INFO \
            --maxfail=2
        timeout-minutes: 12
        continue-on-error: true

      - name: Run ML Pipeline Smoke Test
        env:
          MONGODB_URI: mongodb://localhost:27017
          MLFLOW_TRACKING_URI: file:///tmp/mlflow_smoke
        run: |
          pytest tests/e2e/test_ml_pipeline_e2e.py \
            -v \
            --tb=short \
            -m "smoke" \
            --junit-xml=tests/results/ml-pipeline-smoke-junit.xml \
            --log-cli-level=INFO \
            --maxfail=2
        timeout-minutes: 10

      - name: Upload Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: tests/results/*smoke*-junit.xml

      - name: Smoke Test Summary
        if: always()
        run: |
          echo "## Full Pipeline Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Critical Path Status" >> $GITHUB_STEP_SUMMARY
          if [ -f "tests/results/smoke-test-junit.xml" ]; then
            echo "✅ Happy path smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Happy path smoke tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "tests/results/full-flow-smoke-junit.xml" ]; then
            echo "✅ Full intent-to-code flow passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Full intent-to-code flow not completed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "tests/results/ml-pipeline-smoke-junit.xml" ]; then
            echo "✅ ML pipeline smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ ML pipeline smoke tests not completed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Decision" >> $GITHUB_STEP_SUMMARY
          if [ -f "tests/results/smoke-test-junit.xml" ] && [ -f "tests/results/full-flow-smoke-junit.xml" ]; then
            echo "🚀 Safe to proceed with deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "⛔ Review failures before deployment" >> $GITHUB_STEP_SUMMARY
          fi
