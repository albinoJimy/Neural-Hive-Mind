name: Operational Validation

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  # Job 1: Verificar arquivos órfãos
  check-orphaned-files:
    name: Check Orphaned Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for orphaned files in root
        run: |
          echo "Checking for orphaned files in repository root..."

          # List of patterns to check (should not exist)
          ORPHANS=(
            "=0*"
            "crane"
            "*.tar.gz"
            "*.log"
          )

          FOUND=0
          for pattern in "${ORPHANS[@]}"; do
            if ls $pattern 2>/dev/null; then
              echo "::error::Found orphaned file matching pattern: $pattern"
              FOUND=1
            fi
          done

          # Check for large files (>10MB) in root
          find . -maxdepth 1 -type f -size +10M -not -path "./.git/*" | while read -r file; do
            echo "::warning::Large file in root: $file"
          done

          if [ $FOUND -eq 1 ]; then
            echo "::error::Orphaned files found in repository root!"
            exit 1
          fi

          echo "✓ No orphaned files found"

      - name: Check for worktrees in git
        run: |
          if git ls-files --others --ignored --exclude-standard | grep -q ".claude/worktrees"; then
            echo "::error::Worktrees found in git index!"
            echo "Run: git rm --cached -r .claude/worktrees/"
            exit 1
          fi
          echo "✓ No worktrees in git index"

  # Job 2: Validar pinning de dependências
  check-dependencies:
    name: Check Dependency Pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for unpinned dependencies
        run: |
          echo "Checking for unpinned dependencies (>=, ~=, >, <)..."

          # Find all requirements.txt (not dev, test, frozen, mlruns)
          FILES=$(find services -name "requirements*.txt" \
            -not -name "*dev*" \
            -not -name "*test*" \
            -not -name "*frozen*" \
            -not -path "*/mlruns/*")

          RANGES_FOUND=0
          for file in $FILES; do
            # Check for ranges (skip comments)
            RANGES=$(grep -E "^[a-z].*>=" "$file" || true)
            if [ -n "$RANGES" ]; then
              echo "::warning::Unpinned dependencies in $file:"
              echo "$RANGES"
              RANGES_FOUND=1
            fi
          done

          if [ $RANGES_FOUND -eq 1 ]; then
            echo "::error::Found unpinned dependencies!"
            echo "Run: scripts/freeze_requirements.sh"
            exit 1
          fi

          echo "✓ All dependencies are pinned"

      - name: Verify .frozen files exist
        run: |
          echo "Checking for requirements.frozen files..."

          # Find all requirements.txt with unpinned deps
          FILES=$(find services -name "requirements*.txt" \
            -not -name "*dev*" \
            -not -name "*test*" \
            -not -name "*frozen*" \
            -not -path "*/mlruns/*")

          MISSING=0
          for file in $FILES; do
            if grep -qE "(>=|~=|>|<)" "$file" 2>/dev/null; then
              if [ ! -f "${file}.frozen" ]; then
                echo "::error::Missing .frozen file for $file"
                MISSING=1
              fi
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "::error::Some requirements.txt are missing .frozen files!"
            exit 1
          fi

          echo "✓ All .frozen files exist"

  # Job 3: Docker image security scan
  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway-intencoes
          - approval-service
          - consensus-engine
          - orchestrator-dynamic
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          if [ "${{ matrix.service }}" = "gateway-intencoes" ] && [ -f "services/${{ matrix.service }}/Dockerfile.multi-stage" ]; then
            docker build -f services/${{ matrix.service }}/Dockerfile.multi-stage -t test-${{ matrix.service }} .
          else
            docker build -f services/${{ matrix.service }}/Dockerfile -t test-${{ matrix.service }} .
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-${{ matrix.service }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for critical vulnerabilities
        run: |
          # Check if Trivy found CRITICAL vulnerabilities
          if grep -q '"severity": "CRITICAL"' trivy-results.sarif 2>/dev/null; then
            echo "::error::Critical vulnerabilities found in ${{ matrix.service }}!"
            echo "Review Trivy results for details."
            # Uncomment to fail on critical vulnerabilities:
            # exit 1
          else
            echo "✓ No critical vulnerabilities found"
          fi

  # Job 4: Check docs/archive organization
  check-docs-organization:
    name: Check Documentation Organization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check archive structure
        run: |
          echo "Checking docs/archive/ structure..."

          # Archive directory should exist
          if [ ! -d "docs/archive" ]; then
            echo "::error::docs/archive/ directory not found!"
            exit 1
          fi

          # index.md should exist
          if [ ! -f "docs/archive/index.md" ]; then
            echo "::error::docs/archive/index.md not found!"
            exit 1
          fi

          # Count archived files
          ARCHIVED=$(find docs/archive -type f | wc -l)
          echo "✓ Archive contains $ARCHIVED files"

          # Check for historical docs in root (should be archived)
          HISTORICAL_PATTERNS=(
            "RELATORIO_*.md"
            "RESUMO_*.md"
            "SUMARIO_*.md"
            "STATUS_*.md"
            "RESULTADO_*.md"
            "SESSAO_*.md"
            "EKS_*.md"
            "DEPLOYMENT_*.md"
            "VALIDACAO_*.md"
            "VALIDATION_*.md"
            "TESTE_*.md"
            "DIAGNOSTIC_*.md"
          )

          FOUND_UNARCHIVED=0
          for pattern in "${HISTORICAL_PATTERNS[@]}"; do
            if ls $pattern 2>/dev/null; then
              echo "::warning::Historical document in root matching: $pattern"
              FOUND_UNARCHIVED=1
            fi
          done

          if [ $FOUND_UNARCHIVED -eq 1 ]; then
            echo "::warning::Some historical documents may need to be archived"
          else
            echo "✓ Root directory is clean"
          fi

  # Summary
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [check-orphaned-files, check-dependencies, docker-scan, check-docs-organization]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Operational Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Orphaned Files | ${{ needs.check-orphaned-files.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.check-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Scan | ${{ needs.docker-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs Organization | ${{ needs.check-docs-organization.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.check-orphaned-files.result }}" = "success" ] && \
             [ "${{ needs.check-dependencies.result }}" = "success" ] && \
             [ "${{ needs.check-docs-organization.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All operational validations passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Some validations failed. Please review." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
