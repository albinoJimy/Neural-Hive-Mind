name: E2E Suite 02 - Cognitive Pipeline

description: Semantic Translation Engine, NLP pipeline, and intent processing tests

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'services/semantic-translation-engine/**'
      - '.github/workflows/e2e-suite-02-cognitive.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/semantic-translation-engine/**'

jobs:
  cognitive-pipeline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping: 1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd="kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r tests/requirements-test.txt
          pip install -e libraries/python/neural_hive_resilience
          pip install -e libraries/python/neural_hive_ml
          pip install -e libraries/neural_hive_integration

      - name: Install STE dependencies
        run: |
          cd services/semantic-translation-engine
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run STE Unit Tests
        run: |
          cd services/semantic-translation-engine
          pytest tests/unit/ -v --tb=short --junit-xml=../../tests/results/ste-unit-junit.xml || true

      - name: Run Avro Flow E2E Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          pytest tests/e2e/test_avro_flow_complete.py \
            -v \
            --tb=short \
            --junit-xml=tests/results/avro-flow-junit.xml \
            --cov=services/semantic-translation-engine \
            --cov-report=xml:tests/results/ste-coverage.xml \
            --log-cli-level=INFO
        timeout-minutes: 12

      - name: Run Approval Flow E2E Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: |
          cd services/semantic-translation-engine
          pytest tests/e2e/test_approval_flow.py \
            -v \
            --tb=short \
            -m "e2e and approval_flow and not slow" \
            --junit-xml=../../tests/results/approval-flow-junit.xml \
            --cov=src \
            --cov-report=xml:../../tests/results/approval-flow-coverage.xml \
            --log-cli-level=INFO
        timeout-minutes: 10

      - name: Run Cognitive Pipeline Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          pytest tests/e2e/test_complete_flow_intent_to_artifact.py \
            -v \
            --tb=short \
            -m "cognitive" \
            --junit-xml=tests/results/cognitive-pipeline-junit.xml \
            --log-cli-level=INFO
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload Cognitive Pipeline Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-e2e-results
          path: tests/results/*-junit.xml

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: tests/results/ste-coverage.xml,tests/results/approval-flow-coverage.xml
          flags: e2e,cognitive,ste
          fail_ci_if_error: false

      - name: Cognitive Pipeline Summary
        if: always()
        run: |
          echo "## Cognitive Pipeline E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "tests/results/avro-flow-junit.xml" ]; then
            echo "✅ Avro flow tests completed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "tests/results/approval-flow-junit.xml" ]; then
            echo "✅ Approval flow tests completed" >> $GITHUB_STEP_SUMMARY
          fi
