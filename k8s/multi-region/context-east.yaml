# =============================================================================
# Neural Hive-Mind - Kubernetes Context US East 1
# =============================================================================
# Contexto para cluster primário em us-east-1
# =============================================================================

apiVersion: v1
kind: Config
clusters:
  - name: neural-hive-east
    cluster:
      # Substituir com valores reais após criar o cluster
      server: https://ABCDEF123456.gr7.us-east-1.eks.amazonaws.com
      certificate-authority-data: LS0tLS1CRUdJTi...

# -----------------------------------------------------------------------------
# Users
# -----------------------------------------------------------------------------
users:
  - name: neural-hive-admin-east
    user:
      execProvider:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: aws
        args:
          - eks
          - get-token
          - --cluster-name
          - neural-hive-east
          - --region
          - us-east-1
        env:
          - name: AWS_PROFILE
            value: nhm-prod

# -----------------------------------------------------------------------------
# Contexts
# -----------------------------------------------------------------------------
contexts:
  - name: neural-hive-east
    context:
      cluster: neural-hive-east
      user: neural-hive-admin-east
      namespace: neural-hive-mind

# -----------------------------------------------------------------------------
# Current Context
# -----------------------------------------------------------------------------
current-context: neural-hive-east

# -----------------------------------------------------------------------------
# Namespace
# -----------------------------------------------------------------------------
# O namespace neural-hive-mind deve ser criado separadamente
# kubectl create namespace neural-hive-mind --context=neural-hive-east
