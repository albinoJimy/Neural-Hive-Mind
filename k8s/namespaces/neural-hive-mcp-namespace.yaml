apiVersion: v1
kind: Namespace
metadata:
  name: neural-hive-mcp
  labels:
    name: neural-hive-mcp
    neural-hive-mind.org/component: mcp-servers
    app.kubernetes.io/part-of: neural-hive-mind
    istio-injection: enabled

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: repo-code-pvc
  namespace: neural-hive-mcp
  labels:
    app: neural-hive-mcp
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: # Use default storage class
