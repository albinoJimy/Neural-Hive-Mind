# Pod Disruption Budgets - Neural Hive Mind
#
# Propósito: Garantir disponibilidade mínima durante maintenance (node drains, updates)
# Especificação: HA-001-04
#
# PDBs configurados para:
# - minAvailable: Número mínimo de pods que devem permanecer disponíveis
# - maxUnavailable: Número máximo de pods que podem ficar indisponíveis
#
# Strategy: Para serviços com replicação >= 3, usar minAvailable: 1
#            Para serviços com replicação >= 2, usar maxUnavailable: 1

---
# Gateway de Intenções - Ponto de entrada principal
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-intencoes-pdb
  namespace: neural-hive
  labels:
    app: gateway-intencoes
    component: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-intencoes

