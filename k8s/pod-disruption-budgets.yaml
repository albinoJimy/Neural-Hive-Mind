# Pod Disruption Budgets - Neural Hive Mind
#
# Propósito: Garantir disponibilidade mínima durante maintenance (node drains, updates)
# Especificação: HA-001-04
#
# IMPORTANTE: Este ficheiro contém APENAS PDBs para componentes cujo Helm chart
# ainda não fornece um template PodDisruptionBudget próprio.
#
# Componentes COM PDB no respectivo chart Helm (não duplicar aqui):
#   - gateway-intencoes, semantic-translation-engine, consensus-engine,
#     orchestrator-dynamic, worker-agents, service-registry, self-healing-engine,
#     execution-ticket-service, sla-management-system, scout-agents, guard-agents
#   Estes têm PDB com selector app.kubernetes.io/name; adicionar aqui causa
#   MultiplePodDisruptionBudgets warning porque os pods Helm têm ambos labels
#   (app.kubernetes.io/name e app legacy).
#
# Componentes ABAIXO: charts Helm sem template PDB → adicionar template no chart
# e remover daqui à medida que cada um for migrado.

---
# Approval Service (chart helm-charts/approval-service não tem template PDB)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: approval-service-pdb
  namespace: neural-hive
  labels:
    app: approval-service
    component: approval
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: approval-service

---
# Queen Agent (chart tem pdb.enabled mas falta template)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: queen-agent-pdb
  namespace: neural-hive
  labels:
    app: queen-agent
    component: coordination
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: queen-agent

---
# Specialist Evolution
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: specialist-evolution-pdb
  namespace: neural-hive
  labels:
    app: specialist-evolution
    component: ml
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: specialist-evolution

---
