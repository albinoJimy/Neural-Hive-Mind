apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    name: gateway
    neuralhive/layer: application
    neuralhive/phase: phase3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unified-gateway-config
  namespace: gateway
data:
  KAFKA_BOOTSTRAP_SERVERS: "neural-hive-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_BROKERS: "neural-hive-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  REDIS_HOST: "redis.redis-cluster.svc.cluster.local"
  REDIS_PORT: "6379"
  MONGODB_HOST: "mongodb.mongodb-cluster.svc.cluster.local"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "neural_hive"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "kubernetes"
  # Neural Hive Observability Metadata
  NEURAL_HIVE_SERVICE_NAME: "unified-gateway"
  NEURAL_HIVE_COMPONENT: "gateway"
  NEURAL_HIVE_LAYER: "experiencia"
  # gRPC Services
  NLU_SERVICE_ADDRESS: "nlu-service.nlu.svc.cluster.local:8020"
  PII_SERVICE_ADDRESS: "pii-service.pii.svc.cluster.local:8021"
  GRPC_MAX_RECEIVE_MESSAGE_LENGTH: "104857600"  # 100MB
  GRPC_TIMEOUT_SECONDS: "30"
  # Circuit Breaker
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT_SECONDS: "60"
  CIRCUIT_BREAKER_HALF_OPEN_ATTEMPTS: "3"
---
apiVersion: v1
kind: Secret
metadata:
  name: unified-gateway-secrets
  namespace: gateway
type: Opaque
stringData:
  REDIS_PASSWORD: ""
  MONGODB_USERNAME: "root"
  MONGODB_PASSWORD: "local_dev_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-gateway
  namespace: gateway
  labels:
    app: unified-gateway
    component: gateway
    neuralhive/layer: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unified-gateway
  template:
    metadata:
      labels:
        app: unified-gateway
        app.kubernetes.io/name: unified-gateway
        app.kubernetes.io/instance: unified-gateway
        component: gateway
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: unified-gateway
        image: ghcr.io/albinojimy/neural-hive-mind/unified-gateway:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7999
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: unified-gateway-config
        - secretRef:
            name: unified-gateway-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7999
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 7999
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unified-gateway
  namespace: gateway
  labels:
    app: unified-gateway
    component: gateway
spec:
  selector:
    app: unified-gateway
  ports:
  - name: http
    port: 7999
    targetPort: 7999
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unified-gateway-hpa
  namespace: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unified-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
