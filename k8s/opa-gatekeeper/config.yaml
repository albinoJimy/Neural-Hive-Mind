# ConstraintTemplate para Secret Encryption
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: secretencryption
  annotations:
    description: "Exige que secrets confidenciais usem ExternalSecret ou tenham anotação de criptografia"
spec:
  crd:
    spec:
      names:
        kind: SecretEncryption
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package secretencryption

        import future.keywords.contains

        violation[{"msg": msg}] {
          input.review.kind.kind == "Secret"
          input.review.object.metadata.namespace in {"production", "prod"}
          input.review.object.type != "external-secret-operator.io/external-secret"
          not object.get(input.review.object.metadata.annotations, "neural-hive.io/encrypted", "") == "true"
          msg := "Secret em produção deve usar ExternalSecrets ou ter criptografia extra"
        }

---
# ConstraintTemplate para Network Policy
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: networkpolicy
  annotations:
    description: "Exige NetworkPolicy para workloads em namespaces governados"
spec:
  crd:
    spec:
      names:
        kind: NetworkPolicy
      validation:
        openAPIV3Schema:
          type: object
          properties:
            require_for_namespaces:
              type: array
              items:
                type: string
              default: ["production", "prod", "staging"]
            excluded_workloads:
              type: array
              items:
                type: string
              default: []
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package networkpolicy

        import future.keywords.contains

        violation[{"msg": msg}] {
          input.review.kind.kind in {"Deployment", "StatefulSet", "DaemonSet"}
          input.review.object.metadata.namespace in input.parameters.require_for_namespaces
          not input.review.object.metadata.name in input.parameters.excluded_workloads
          not has_network_policy(input.review.object.metadata.namespace)
          msg := "Workload em namespace governado deve ter NetworkPolicy correspondente"
        }

        # Esta é uma verificação simplificada - em produção seria necessário
        # verificar se existe uma NetworkPolicy que seleciona este pod
        has_network_policy(namespace) {
          # Assumimos que existe NetworkPolicy se o namespace está bem configurado
          # Em produção, isso verificaria o cluster state
          true
        }

---
# ConstraintTemplate para RBAC Restrictions
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: rbacrestrictions
  annotations:
    description: "Restringe role bindings permissivas (cluster-admin, etc)"
spec:
  crd:
    spec:
      names:
        kind: RBACRestrictions
      validation:
        openAPIV3Schema:
          type: object
          properties:
            forbidden_roles:
              type: array
              items:
                type: string
              default: ["cluster-admin", "admin", "edit"]
            allowed_subjects:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package rbacrestrictions

        import future.keywords.contains
        import future.keywords.if

        violation[{"msg": msg}] {
          input.review.kind.kind == "ClusterRoleBinding"
          some roleRef in [input.review.object.roleRef]
          roleRef.name in input.parameters.forbidden_roles
          not is_allowed_subject(input.review.object.subjects)
          msg := sprintf("ClusterRoleBinding para role '%v' só é permitido para subjects específicos", [roleRef.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "RoleBinding"
          input.review.object.metadata.namespace in {"production", "prod"}
          some roleRef in [input.review.object.roleRef]
          roleRef.name in input.parameters.forbidden_roles
          not is_allowed_subject(input.review.object.subjects)
          msg := sprintf("RoleBinding para role '%v' em produção só é permitido para subjects específicos", [roleRef.name])
        }

        is_allowed_subject(subjects) {
          count(input.parameters.allowed_subjects) == 0
        }

        is_allowed_subject(subjects) {
          some subject in subjects
          subject.name in input.parameters.allowed_subjects
        }

---
# ConstraintTemplate para Container Runtime
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: containerruntime
  annotations:
    description: "Restringe configurações de runtime de container"
spec:
  crd:
    spec:
      names:
        kind: ContainerRuntime
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allow_capabilities_add:
              type: array
              items:
                type: string
              default: []
            require_read_only_root:
              type: boolean
              default: true
            require_drop_all:
              type: boolean
              default: true
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package containerruntime

        import future.keywords.contains
        import future.keywords.if

        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          capabilities := object.get(container.securityContext, "capabilities", {})
          add_caps := object.get(capabilities, "add", [])
          some cap in add_caps
          not cap in input.parameters.allow_capabilities_add
          msg := sprintf("Container '%v' tem capability não permitida: %v", [container.name, cap])
        }

        violation[{"msg": msg}] {
          input.parameters.require_read_only_root == true
          container := containers[_]
          securityContext := container.securityContext
          not object.get(securityContext, "readOnlyRootFilesystem", false)
          msg := sprintf("Container '%v' deve ter root filesystem read-only", [container.name])
        }

        violation[{"msg": msg}] {
          input.parameters.require_drop_all == true
          container := containers[_]
          capabilities := object.get(container.securityContext, "capabilities", {})
          drop_caps := object.get(capabilities, "drop", [])
          not contains(drop_caps, "ALL")
          msg := sprintf("Container '%v' deve fazer drop de ALL capabilities", [container.name])
        }

---
# ConstraintTemplate para CPU Limit
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: cpulimit
  annotations:
    description: "Limita o máximo de CPU que um container pode utilizar"
spec:
  crd:
    spec:
      names:
        kind: CPULimit
      validation:
        openAPIV3Schema:
          type: object
          properties:
            max_cpu:
              type: string
              default: "4"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package cpulimit

        import future.keywords.contains

        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          cpu_limit := container.resources.limits.cpu
          parse_cpu(cpu_limit) > parse_cpu(input.parameters.max_cpu)
          msg := sprintf("Container '%v' excede CPU limit máximo: %v > %v", [container.name, cpu_limit, input.parameters.max_cpu])
        }

        parse_cpu(str) := result {
          endswith(str, "m")
          result := to_number(trim_suffix(str, "m"))
        }

        parse_cpu(str) := result {
          not endswith(str, "m")
          result := to_number(str) * 1000
        }

---
