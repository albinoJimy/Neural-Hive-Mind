        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          memory_limit := container.resources.limits.memory
          parse_memory(memory_limit) > parse_memory(input.parameters.max_memory)
          msg := sprintf("Container '%v' excede memory limit máximo: %v > %v", [container.name, memory_limit, input.parameters.max_memory])
        }

        parse_memory(str) := result {
          endswith(str, "Gi")
          result := to_number(trim_suffix(str, "Gi")) * 1024
        }

        parse_memory(str) := result {
          endswith(str, "Mi")
          result := to_number(trim_suffix(str, "Mi"))
        }

---
# ConstraintTemplate para Audit Logging
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: auditlogging
  annotations:
    description: "Exige configuração de audit logging para workloads críticos"
spec:
  crd:
    spec:
      names:
        kind: AuditLogging
      validation:
        openAPIV3Schema:
          type: object
          properties:
            require_for_namespaces:
              type: array
              items:
                type: string
              default: ["production", "prod"]
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package auditlogging

        import future.keywords.contains

        violation[{"msg": msg}] {
          input.review.kind.kind in {"Deployment", "StatefulSet", "DaemonSet"}
          input.review.object.metadata.namespace in input.parameters.require_for_namespaces
          not has_audit_annotation(input.review.object.metadata.annotations)
          msg := "Workload crítico deve ter anotação de audit logging"
        }

        has_audit_annotation(annotations) {
          annotations != null
          annotations["neural-hive.io/audit-log"] == "enabled"
        }

