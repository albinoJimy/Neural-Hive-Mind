# OPA Gatekeeper Configuration for Neural Hive-Mind
# Epic H - OPA Gatekeeper Webhook Configuration
#
# Este arquivo configura o OPA Gatekeeper com 17 políticas de segurança
# que serão validadas via admission webhook antes da criação de recursos.
#
# Deploy:
#   kubectl apply -f k8s/opa-gatekeeper/config.yaml
#   kubectl apply -f k8s/opa-gatekeeper/validating-webhook.yaml

apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
spec:
  # Sync configurações para gerir recursos do cluster
  sync:
    syncOnly:
      - group: ""
        version: v1
        kind: Namespace
      - group: networking.k8s.io
        version: v1
        kind: Ingress
      - group: networking.istio.io
        version: v1beta1
        kind: VirtualService
      - group: security.istio.io
        version: v1beta1
        kind: RequestAuthentication
      - group: security.istio.io
        version: v1beta1
        kind: AuthorizationPolicy
      - group: rbac.authorization.k8s.io
        version: v1
        kind: Role
      - group: rbac.authorization.k8s.io
        version: v1
        kind: RoleBinding
      - group: rbac.authorization.k8s.io
        version: v1
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        version: v1
        kind: ClusterRoleBinding

  # Validação de recursos antes da aplicação
  validation:
    # Validar todos os recursos por padrão
    - enforcementAction: deny
      exclusionNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - gatekeeper-system
        - istio-system
      excludedResources:
        - Event
        - ClusterRole
        - ClusterRoleBinding
        - CertificateSigningRequest

---
# ConstraintTemplate para OAuth2 Token Required
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: oauth2tokenrequired
  annotations:
    description: "Exige autenticação OAuth2 para serviços críticos do Neural Hive-Mind"
spec:
  crd:
    spec:
      names:
        kind: OAuth2TokenRequired
      validation:
        openAPIV3Schema:
          type: object
          properties:
            oauth2_required_services:
              type: array
              items:
                type: string
              default: ["gateway-intencoes", "neural-hive-api"]
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package oauth2tokenrequired

        import future.keywords.contains
        import future.keywords.if

        oauth2_required_services := input.parameters.oauth2_required_services

        violation[{"msg": msg}] {
          input.review.kind.kind == "Service"
          input.review.object.metadata.name in oauth2_required_services
          not object.get(input.review.object.metadata.annotations, "auth.neural-hive/required", "") == "true"
          msg := sprintf("Service %s deve ter annotation 'auth.neural-hive/required: true' para OAuth2", [input.review.object.metadata.name])
        }

---
# ConstraintTemplate para Mesh mTLS Required
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: meshmtlsrequired
  annotations:
    description: "Exige mTLS STRICT para workloads no service mesh"
spec:
  crd:
    spec:
      names:
        kind: MeshMtlsRequired
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package meshmtlsrequired

        import future.keywords.contains
        import future.keywords.if

        excluded_namespaces := {"kube-system", "kube-public", "kube-node-lease", "istio-system", "gatekeeper-system"}

        violation[{"msg": msg}] {
          input.review.kind.kind == "Deployment"
          not input.review.object.metadata.namespace in excluded_namespaces
          not has_strict_mtls(input.review.object.metadata.namespace)
          msg := sprintf("Namespace '%v' deve ter PeerAuthentication com mTLS STRICT antes de criar Deployments", [input.review.object.metadata.namespace])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "StatefulSet"
          not input.review.object.metadata.namespace in excluded_namespaces
          not has_strict_mtls(input.review.object.metadata.namespace)
          msg := sprintf("Namespace '%v' deve ter PeerAuthentication com mTLS STRICT antes de criar StatefulSets", [input.review.object.metadata.namespace])
        }

        has_strict_mtls(namespace) {
          startswith(namespace, "neural-hive-")
        }

---
# ConstraintTemplate para Redis Security Required
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: redissecurityrequired
  annotations:
    description: "Exige configurações de segurança para Redis clusters"
spec:
  crd:
    spec:
      names:
        kind: RedisSecurityRequired
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package redissecurityrequired

        import future.keywords.contains

        violation[{"msg": msg}] {
          input.review.kind.kind == "Service"
          some port in input.review.object.spec.ports
          port.port == 6379
          not object.get(input.review.object.metadata.annotations, "redis.security/auth", "") == "required"
          msg := sprintf("Service Redis %s deve ter annotation 'redis.security/auth: required'", [input.review.object.metadata.name])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "Service"
          some port in input.review.object.spec.ports
          port.port == 6379
          input.review.object.metadata.labels["neural-hive.io/environment"] == "prod"
          not object.get(input.review.object.metadata.annotations, "redis.security/tls", "") == "required"
          msg := sprintf("Service Redis %s em produção deve ter TLS obrigatório", [input.review.object.metadata.name])
        }

---
# ConstraintTemplate para Ethical Guardrails
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ethicalguardrails
  annotations:
    description: "Aplica guardrails éticos para decisões críticas do Neural Hive-Mind"
spec:
  crd:
    spec:
      names:
        kind: EthicalGuardrails
      validation:
        openAPIV3Schema:
          type: object
          properties:
            max_risk_score:
              type: number
              default: 0.9
            min_confidence_for_critical:
              type: number
              default: 0.7
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ethicalguardrails

        import future.keywords.contains
        import future.keywords.if

        violation[{"msg": msg}] {
          input.review.kind.kind == "CognitivePlan"
          risk_score := input.review.object.spec.risk_assessment.risk_score
          risk_score > input.parameters.max_risk_score
          msg := sprintf("Risk score %v excede threshold de %v", [risk_score, input.parameters.max_risk_score])
        }

        violation[{"msg": msg}] {
          input.review.kind.kind == "CognitivePlan"
          decision_type := input.review.object.spec.decision_type
          critical_types := {"REPLANNING", "EXCEPTION_APPROVAL", "QOS_ADJUSTMENT"}
          decision_type in critical_types
          confidence := input.review.object.spec.confidence_score
          confidence < input.parameters.min_confidence_for_critical
          msg := sprintf("Decisão crítica %v com confiança baixa: %v", [decision_type, confidence])
        }

---
# ConstraintTemplate para Pod Security Policy
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: podsecuritypolicy
  annotations:
    description: "Aplica políticas de segurança para pods (baseline)"
spec:
  crd:
    spec:
      names:
        kind: PodSecurityPolicy
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowPrivileged:
              type: boolean
              default: false
            allowHostNetwork:
              type: boolean
              default: false
            allowHostPID:
              type: boolean
              default: false
            allowHostIPC:
              type: boolean
              default: false
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package podsecuritypolicy

        import future.keywords.contains
        import future.keywords.if

        # Containers from all pod types
        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          input.parameters.allowPrivileged != true
          container := containers[_]
          container.securityContext.privileged == true
          msg := sprintf("Container '%v' não deve executar em modo privilegiado", [container.name])
        }

        violation[{"msg": msg}] {
          input.parameters.allowHostNetwork != true
          input.review.object.spec.hostNetwork == true
          msg := "Pod não deve usar hostNetwork"
        }

        violation[{"msg": msg}] {
          input.parameters.allowHostPID != true
          input.review.object.spec.hostPID == true
          msg := "Pod não deve usar hostPID"
        }

        violation[{"msg": msg}] {
          input.parameters.allowHostIPC != true
          input.review.object.spec.hostIPC == true
          msg := "Pod não deve usar hostIPC"
        }

        violation[{"msg": msg}] {
          container := containers[_]
          securityContext := container.securityContext
          securityContext.runAsUser == 0
          not object.get(securityContext, "runAsNonRoot", false)
          msg := sprintf("Container '%v' não deve executar como root (runAsUser=0)", [container.name])
        }

---
# ConstraintTemplate para Resource Limits
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: resourcelimits
  annotations:
    description: "Exige resource limits e requests para todos os containers"
spec:
  crd:
    spec:
      names:
        kind: ResourceLimits
      validation:
        openAPIV3Schema:
          type: object
          properties:
            max_cpu:
              type: string
              default: "4"
            max_memory:
              type: string
              default: "8Gi"
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package resourcelimits

        import future.keywords.contains
        import future.keywords.if

        # Containers from all pod types
        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.limits.cpu
          msg := sprintf("Container '%v' deve definir CPU limits", [container.name])
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.limits.memory
          msg := sprintf("Container '%v' deve definir memory limits", [container.name])
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.requests.cpu
          msg := sprintf("Container '%v' deve definir CPU requests", [container.name])
        }

        violation[{"msg": msg}] {
          container := containers[_]
          not container.resources.requests.memory
          msg := sprintf("Container '%v' deve definir memory requests", [container.name])
        }

---
# ConstraintTemplate para Image Policy
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: imagepolicy
  annotations:
    description: "Controla imagens de container permitidas (registries, tags, assinaturas)"
spec:
  crd:
    spec:
      names:
        kind: ImagePolicy
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowed_registries:
              type: array
              items:
                type: string
              default: ["ghcr.io/albinojimy/", "docker.io/neuralhive/", "gcr.io/distroless/"]
            require_signature:
              type: boolean
              default: false
            allow_latest_tag:
              type: boolean
              default: false
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package imagepolicy

        import future.keywords.contains
        import future.keywords.if

        containers[container] {
          container := input.review.object.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.initContainers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.containers[_]
        }

        containers[container] {
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        violation[{"msg": msg}] {
          container := containers[_]
          image := container.image
          not from_allowed_registry(image)
          msg := sprintf("Container '%v' usa imagem de registry não autorizado: %v", [container.name, image])
        }

        violation[{"msg": msg}] {
          input.parameters.allow_latest_tag != true
          container := containers[_]
          image := container.image
          endswith(image, ":latest")
          msg := sprintf("Container '%v' não deve usar tag :latest", [container.name])
        }

        violation[{"msg": msg}] {
          input.parameters.allow_latest_tag != true
          container := containers[_]
          image := container.image
          not contains(image, ":")
          msg := sprintf("Container '%v' deve usar tag específica", [container.name])
        }

        violation[{"msg": msg}] {
          input.parameters.require_signature == true
          container := containers[_]
          image := container.image
          not contains(image, "@sha256:")
          msg := sprintf("Container '%v' usa imagem não assinada: %v", [container.name, image])
        }

        from_allowed_registry(image) {
          registry := input.parameters.allowed_registries[_]
          startswith(image, registry)
        }

---
