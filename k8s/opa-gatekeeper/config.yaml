# ConstraintTemplate para Ingress TLS
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: ingresstls
  annotations:
    description: "Exige TLS em ingresses para ambientes de produção"
spec:
  crd:
    spec:
      names:
        kind: IngressTLS
      validation:
        openAPIV3Schema:
          type: object
          properties:
            require_in_prod:
              type: boolean
              default: true
            excluded_namespaces:
              type: array
              items:
                type: string
              default: ["kube-system", "gatekeeper-system"]
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ingresstls

        import future.keywords.contains
        import future.keywords.if

        violation[{"msg": msg}] {
          input.review.kind.kind == "Ingress"
          input.parameters.require_in_prod == true
          input.review.object.metadata.namespace in {"production", "prod"}
          not input.review.object.namespace in input.parameters.excluded_namespaces
          not input.review.object.spec.tls
          msg := "Ingress em produção deve ter TLS configurado"
        }

