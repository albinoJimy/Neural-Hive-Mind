# OPA Gatekeeper ValidatingWebhookConfiguration
# Epic H - H002: ValidatingWebhookConfiguration
#
# Este arquivo configura o webhook de admission do Kubernetes
# para interceptar e validar recursos antes da sua criação/atualização.
#
# Deploy:
#   kubectl apply -f k8s/opa-gatekeeper/validating-webhook.yaml
#
# Pré-requisitos:
#   - OPA Gatekeeper deve estar instalado no cluster
#   - As políticas do config.yaml devem estar aplicadas

---
# ValidatingWebhookConfiguration para o Gatekeeper
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gatekeeper-validating-webhook-configuration
  annotations:
    description: "Webhook de admission do Gatekeeper para validar políticas OPA"
    neural-hive.io/epic: "Epic-H"
    neural-hive.io/ticket: "H002"
webhooks:
  - name: validation.gatekeeper.sh
    rules:
      # Validar Pods
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"

      # Validar Deployments
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: "Namespaced"

      # Validar StatefulSets
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
        scope: "Namespaced"

      # Validar DaemonSets
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["daemonsets"]
        scope: "Namespaced"

      # Validar ReplicaSets
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["replicasets"]
        scope: "Namespaced"

      # Validar Services
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
        scope: "Namespaced"

      # Validar ConfigMaps
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        scope: "Namespaced"

      # Validar Secrets
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
        scope: "Namespaced"

      # Validar Namespaces
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
        scope: "Cluster"

      # Validar Ingress
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
        scope: "Namespaced"

      # Validar NetworkPolicy
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
        scope: "Namespaced"

      # Validar PersistentVolumeClaims
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["persistentvolumeclaims"]
        scope: "Namespaced"

      # Validar RoleBindings
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
        scope: "Namespaced"

      # Validar ClusterRoleBindings
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterrolebindings"]
        scope: "Cluster"

      # Validar Custom Resources do Neural Hive-Mind
      - apiGroups: ["neuralhive.io"]
        apiVersions: ["v1", "v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cognitiveplans", "executiontickets", "specialistdecisions"]
        scope: "Namespaced"

      # Validar Istio VirtualServices
      - apiGroups: ["networking.istio.io"]
        apiVersions: ["v1beta1", "v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["virtualservices"]
        scope: "Namespaced"

      # Validar Istio RequestAuthentication
      - apiGroups: ["security.istio.io"]
        apiVersions: ["v1beta1", "v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["requestauthentications"]
        scope: "Namespaced"

      # Validar Istio AuthorizationPolicy
      - apiGroups: ["security.istio.io"]
        apiVersions: ["v1beta1", "v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["authorizationpolicies"]
        scope: "Namespaced"

      # Validar ConstraintTemplates do Gatekeeper
      - apiGroups: ["templates.gatekeeper.sh"]
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["constrainttemplates"]
        scope: "Cluster"

      # Validar Constraints do Gatekeeper
      - apiGroups: ["constraints.gatekeeper.sh"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: "*"

    clientConfig:
      # Service do Gatekeeper
      service:
        name: gatekeeper-webhook-service
        namespace: gatekeeper-system
        path: "/v1/admit"
        port: 443

      # CA Bundle para comunicação TLS
      caBundle: 

    # Timeout para avaliação da política (30 segundos)
    timeoutSeconds: 30

    # Política de falha: bloquear se o webhook não estiver disponível
    failurePolicy: Fail

    # Re-admitir recursos já existentes após webhook iniciar
    sideEffects: None

    # Não validar novamente se já aprovado (performance)
    admissionReviewVersions: ["v1", "v1beta1"]

    # Match policies para excluir recursos específicos
    namespaceSelector:
      matchExpressions:
        # Excluir namespaces críticos do sistema (mas permitir validação em production/staging)
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - gatekeeper-system

    # Object selector para filtrar recursos específicos
    objectSelector:
      matchExpressions:
        # Validar recursos com label de governança
        - key: neural-hive.io/governed
          operator: In
          values:
            - "true"
            - "enforced"

---
# ValidatingWebhookConfiguration para auditoria (modo warn)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gatekeeper-audit-webhook-configuration
  annotations:
    description: "Webhook de auditoria do Gatekeeper (modo warn, não bloqueia)"
webhooks:
  - name: audit.gatekeeper.sh
    rules:
      # Mesmas regras, mas com modo warn
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "services", "configmaps", "secrets"]
        scope: "Namespaced"

      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
        scope: "Namespaced"

      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses", "networkpolicies"]
        scope: "Namespaced"

    clientConfig:
      service:
        name: gatekeeper-webhook-service
        namespace: gatekeeper-system
        path: "/v1/admit"
        port: 443
      caBundle: 

    timeoutSeconds: 10

    # Política de falha: não bloquear (modo auditoria)
    failurePolicy: Ignore

    sideEffects: None

    admissionReviewVersions: ["v1", "v1beta1"]

---
# MutatingWebhookConfiguration para injecção de labels (opcional)
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: gatekeeper-mutating-webhook-configuration
  annotations:
    description: "Webhook de mutação do Gatekeeper para injecção automática de labels"
webhooks:
  - name: mutation.gatekeeper.sh
    rules:
      # Adicionar labels de governança automaticamente
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "services"]
        scope: "Namespaced"

    clientConfig:
      service:
        name: gatekeeper-webhook-service
        namespace: gatekeeper-system
        path: "/v1/mutate"
        port: 443
      caBundle: 

    timeoutSeconds: 10

    failurePolicy: Ignore

    sideEffects: None

    admissionReviewVersions: ["v1", "v1beta1"]

---
# ConfigMap para configuração adicional do Gatekeeper
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatekeeper-config
  namespace: gatekeeper-system
  annotations:
    neural-hive.io/epic: "Epic-H"
data:
  # Intervalo de sincronização de recursos (default: 60s)
  sync-sync-period: "30s"

  # Limite de concorrência para processamento de admission reviews
  admission-controller-sync-period: "30s"

  # Habilitar dump de logs para troubleshooting (desabilitar em produção)
  enable-tracing: "false"

  # Nível de log (DEBUG, INFO, WARNING, ERROR)
  log-level: "INFO"

  # Máximo de eventos a serem processados em paralelo
  max-workers-threads: "10"

  # Timeout para execução de políticas
  constraint-violation-limit: "100"

  # Configuração de audit
  audit-match-kind-only: "false"
  audit-chunk-size: "500"
  constraint-violations-limit: "100"

  # Lista de namespaces excluídos da validação (separados por vírgula)
  excluded-namespaces: "kube-system,kube-public,kube-node-lease,gatekeeper-system"

  # Label para identificar recursos gerenciados pelo Gatekeeper
  managed-by-label: "gatekeeper.sh/managed"

---
# Secret para TLS do webhook (placeholder - gerar pelo cert-manager ou pelo próprio Gatekeeper)
apiVersion: v1
kind: Secret
metadata:
  name: gatekeeper-webhook-server-cert
  namespace: gatekeeper-system
  annotations:
    neural-hive.io/instruction: "Em produção, gerar certificado válido via cert-manager ou pelo Gatekeeper"
type: kubernetes.io/tls
data:
  # Placeholder - gerar certificados reais em produção
  tls.crt: 
  tls.key: 

---
# Service para o webhook do Gatekeeper
apiVersion: v1
kind: Service
metadata:
  name: gatekeeper-webhook-service
  namespace: gatekeeper-system
  annotations:
    neural-hive.io/epic: "Epic-H"
    neural-hive.io/ticket: "H002"
  labels:
    app: gatekeeper
    gatekeeper.sh/system: "yes"
spec:
  type: ClusterIP
  ports:
    - name: https-webhook
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: https-mutation
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app: gatekeeper
    gatekeeper.sh/system: "yes"
    control-plane: controller-manager

---
# Role para ler ConfigMaps e Secrets (para validação)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatekeeper-manager-role
  annotations:
    neural-hive.io/epic: "Epic-H"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["templates.gatekeeper.sh"]
    resources: ["constrainttemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["constraints.gatekeeper.sh"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding para o Gatekeeper
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gatekeeper-manager-rolebinding
  annotations:
    neural-hive.io/epic: "Epic-H"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gatekeeper-manager-role
subjects:
  - kind: ServiceAccount
    name: gatekeeper-admin
    namespace: gatekeeper-system
