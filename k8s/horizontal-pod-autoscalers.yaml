# Horizontal Pod Autoscalers - Neural Hive Mind
#
# Propósito: Auto-scaling baseado em CPU/memória para serviços com load variável
# Especificação: HA-001-03
#
# Configurações:
# - minReplicas: Mínimo de pods para garantir disponibilidade
# - maxReplicas: Limite superior para controlar custos
# - metrics: CPU (padrão) e memória (quando aplicável)
# - behavior: Stabilization window para evitar flapping

---
# Gateway de Intenções - Alta variabilidade de tráfego
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-intencoes-hpa
  namespace: neural-hive
  labels:
    app: gateway-intencoes
    component: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-intencoes
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

