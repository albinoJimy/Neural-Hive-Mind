# Orchestrator Dynamic - Context Layer Integration
# Deployment com neural_hive_context para routing dinâmico C↔G baseado em workflow_type
---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator-dynamic
  labels:
    name: orchestrator-dynamic
    neuralhive/layer: orchestration
    neuralhive/phase: phase3
---
# ConfigMap específico do Orchestrator com Context Layer
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: orchestrator-dynamic
data:
  ENVIRONMENT: "kubernetes"
  LOG_LEVEL: "INFO"
  SERVICE_NAME: "orchestrator-dynamic"
  SERVICE_VERSION: "1.0.0"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "neural-hive-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP_ID: "orchestrator-dynamic"
  KAFKA_CONSOLIDATED_DECISION_TOPIC: "consolidated-decisions"
  KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"

  # MongoDB
  MONGODB_URI: "mongodb://mongodb.mongodb-cluster.svc.cluster.local:27017"
  MONGODB_DATABASE: "neural_hive"

  # Temporal
  # Service real é temporal-frontend.temporal.svc; o anterior
  # "neural-hive-temporal" não existe e provocava DNS lookup failure
  # bloqueando o startup do orchestrator (incidente 2026-05-18).
  TEMPORAL_HOST: "temporal-frontend.temporal.svc.cluster.local"
  TEMPORAL_PORT: "7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "neural-hive-task-queue"

  # Scheduler
  # service-registry está scaled 0/0 (componente cognitivo desactivado).
  # Com intelligent_scheduler=true, o TemporalWorker._init_components
  # bloqueia em ServiceRegistryClient.initialize() durante startup e a
  # ASGI não consegue fazer bind ao port 8000 → startupProbe falha.
  # Reactivar quando service-registry for re-enable.
  ENABLE_INTELLIGENT_SCHEDULER: "false"

  # PostgreSQL (Temporal state store) — settings.py linhas 126-132
  POSTGRES_HOST: "temporal-postgresql.temporal.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "temporal"
  POSTGRES_USER: "temporal"
  POSTGRES_SSL_MODE: "disable"

  # Redis Cluster (cache) — settings.py linhas 149-153
  REDIS_CLUSTER_NODES: "redis-cluster-lb.redis-cluster.svc.cluster.local:6379"
  REDIS_SSL_ENABLED: "false"

  # Context Layer Settings
  ORCHESTRATOR_ENABLE_DYNAMIC_ROUTING: "true"
  ORCHESTRATOR_WORKFLOW_CLASSIFIER_TYPE: "multi_signal"
  ORCHESTRATOR_DEFAULT_WORKFLOW: "orchestration"

  # Workflow Thresholds
  WORKFLOW_CLASSIFIER_THRESHOLD: "0.45"
  WORKFLOW_CLASSIFIER_SIGNAL_WEIGHTS_SYSTEM: "0.30"
  WORKFLOW_CLASSIFIER_SIGNAL_WEIGHTS_SERVICES: "0.25"
  WORKFLOW_CLASSIFIER_SIGNAL_WEIGHTS_PII: "0.20"
  WORKFLOW_CLASSIFIER_SIGNAL_WEIGHTS_USER_INPUT: "0.25"

  # Observability
  OTEL_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  OTEL_TLS_VERIFY: "false"
  PROMETHEUS_PORT: "8000"

  # ML Drift Detection (FASE 0)
  ML_DRIFT_DETECTION_ENABLED: "true"
  ML_DRIFT_CHECK_ENABLED: "true"
  ML_DRIFT_CHECK_WINDOW_DAYS: "7"
  ML_DRIFT_PSI_THRESHOLD: "0.25"
  ML_DRIFT_MAE_RATIO_THRESHOLD: "1.5"
  ML_DRIFT_KS_PVALUE_THRESHOLD: "0.05"
  DRIFT_REFERENCE_DATASET_PATH: "ml_pipelines/training/reference_data/approval_v7_reference.pkl"
  DRIFT_DETECTION_WINDOW_HOURS: "24"
  DRIFT_THRESHOLD_PSI: "0.2"
  DRIFT_CHECK_INTERVAL_MINUTES: "60"

  # ML Auto-Retrain (FASE 0)
  ML_RETRAINING_TRIGGERS_ENABLED: "true"
  ML_DRIFT_TRIGGER_THRESHOLD: "0.25"
  ML_PERFORMANCE_TRIGGER_THRESHOLD: "1.5"
  ML_DATA_VOLUME_TRIGGER_THRESHOLD: "10000"
  ML_AUTO_ROLLBACK_ENABLED: "true"
  ML_VALIDATION_ENABLED: "true"
  ML_CONTINUOUS_VALIDATION_ENABLED: "true"

  # Model Gradual Rollout (FASE 0)
  ML_GRADUAL_ROLLOUT_ENABLED: "true"
  ML_ROLLBACK_STAGES: "0.25,0.50,0.75,1.0"
  ML_CHECKPOINT_DURATION_MINUTES: "30"
  ML_CHECKPOINT_MAE_THRESHOLD_PCT: "20.0"
  ML_CHECKPOINT_ERROR_RATE_THRESHOLD: "0.001"
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: orchestrator-dynamic
type: Opaque
stringData:
  MONGODB_USERNAME: "root"
  MONGODB_PASSWORD: "local_dev_password"
  TEMPORAL_CLIENT_CERT: ""
  TEMPORAL_PRIVATE_KEY: ""
  # Passwords copiados dos secrets já existentes no cluster (dev defaults).
  # Produção: substituir por ExternalSecrets/SealedSecrets apontando para
  # temporal/temporal-default-store e neural-hive/redis-password.
  POSTGRES_PASSWORD: "temporal"
  REDIS_PASSWORD: "nhm_redis_2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-dynamic
  namespace: orchestrator-dynamic
  labels:
    app: orchestrator-dynamic
    component: orchestrator
    neuralhive/layer: orchestration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator-dynamic
  template:
    metadata:
      labels:
        app: orchestrator-dynamic
        neuralhive/layer: orchestration
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Init container para instalar neural_hive_context
      # NOTA: imagem alinhada com main container (Python 3.11). Usa não-slim porque
      # pip install git+... requer git no PATH; wheels com extensões nativas (pydantic_core)
      # têm que corresponder à versão do interpretador do runtime.
      initContainers:
      - name: install-neural-hive-context
        image: python:3.11
        command:
          - sh
          - -c
          - |
            pip install --no-cache-dir --target=/app/libs \
              git+https://github.com/albinojimy/Neural-Hive-Mind.git@main#subdirectory=libs/neural_hive_context
        volumeMounts:
        - name: python-libs
          mountPath: /app/libs
      containers:
      - name: orchestrator-dynamic
        # Pinado (CI block on :latest). Sincronizar com a versão deployed.
        image: ghcr.io/albinojimy/neural-hive-mind/orchestrator-dynamic:a0fac05
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
          name: http
          protocol: TCP
        - containerPort: 8000
          name: metrics
          protocol: TCP
        env:
        # PYTHONPATH para encontrar neural_hive_context
        - name: PYTHONPATH
          value: "/app/libs:/usr/local/lib/python3.11/site-packages"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - configMapRef:
            name: context-layer-config
        - secretRef:
            name: orchestrator-secrets
        resources:
          requests:
            memory: "350Mi"
            cpu: "200m"
          limits:
            # 1Gi para acomodar picos durante init (Temporal SDK + 4
            # Kafka consumers + gRPC clients). Anterior 512Mi causava
            # OOMKill exit 137 (incidente 2026-05-18).
            memory: "1Gi"
            cpu: "500m"
        # Probes em 8000 — Uvicorn serve toda a app (/health, /ready, /metrics) no
        # mesmo port. O 8003 declarado em ports era apenas histórico.
        # startupProbe dá 300s de grace ao bootstrap (init container pip
        # install + Temporal + Kafka rebalance + gRPC channels antes do
        # uvicorn.run()). Sem isto, livenessProbe matava o pod a 30s.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: python-libs
          mountPath: /app/libs
          readOnly: true
      volumes:
      - name: python-libs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-dynamic
  namespace: orchestrator-dynamic
  labels:
    app: orchestrator-dynamic
spec:
  selector:
    app: orchestrator-dynamic
  ports:
  - name: http
    port: 8003
    targetPort: 8003
    protocol: TCP
  - name: metrics
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-dynamic-hpa
  namespace: orchestrator-dynamic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestrator-dynamic
  minReplicas: 2
  # maxReplicas reduzido de 10 para 3 — cluster está memory-bound; HPA
  # a 10 pods causava Pending por insufficient memory (incidente 2026-05-18).
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orchestrator-dynamic
  namespace: orchestrator-dynamic
  labels:
    app: orchestrator-dynamic
    release: prometheus
spec:
  selector:
    matchLabels:
      app: orchestrator-dynamic
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orchestrator-network-policy
  namespace: orchestrator-dynamic
spec:
  podSelector:
    matchLabels:
      app: orchestrator-dynamic
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Permitir scrape do Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Kafka
  - to:
    - namespaceSelector:
        matchLabels:
          name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # MongoDB
  - to:
    - namespaceSelector:
        matchLabels:
          name: mongodb-cluster
    ports:
    - protocol: TCP
      port: 27017
  # Temporal
  - to:
    - namespaceSelector:
        matchLabels:
          name: temporal
    ports:
    - protocol: TCP
      port: 7233
  # OTEL Collector
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 4317
  # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # External (para pip install)
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
