apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: mlflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        # Gatekeeper constraint `must-have-app-label-all` exige ambas as
        # labels `app` e `app.kubernetes.io/name` em todos os namespaces
        # não-excluídos. Sem isto, o admission webhook recusa o pod.
        app.kubernetes.io/name: mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.9.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-postgres-secret
              key: password
        # mlflow:v2.9.2 não inclui o driver psycopg2 que o backend-store
        # postgresql:// requer. Instalamos no boot para /tmp/lib (writable
        # pelo UID 1000 não-root) e injectamos via PYTHONPATH.
        #
        # Workers reduzidos para 2 — historicamente o default (4) causou
        # contenção/deadlock quando o backend ainda era SQLite; com Postgres
        # 2 workers são suficientes para a carga típica.
        #
        # gunicorn timeout 120s (vs default 30s) — o boot do mlflow pode
        # demorar >30s na primeira request (carrega routes, prepara DB pool),
        # o que originava SIGKILL dos workers e CrashLoopBackOff repetido.
        command:
        - sh
        - -c
        - >-
          pip install --quiet --target=/tmp/lib psycopg2-binary
          && PYTHONPATH=/tmp/lib:$PYTHONPATH exec
          mlflow server
          --host 0.0.0.0
          --port 5000
          --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@mlflow-postgresql:5432/mlflow
          --default-artifact-root /mlflow/artifacts
          --workers 2
          --gunicorn-opts "--timeout 120 --graceful-timeout 60"
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 15
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 0
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-artifacts-pvc
