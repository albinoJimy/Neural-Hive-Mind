apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-inference-api-config
  namespace: neural-hive
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "kubernetes"
  NEURAL_HIVE_SERVICE_NAME: "ml-inference-api"
  NEURAL_HIVE_COMPONENT: "ml-inference"
  NEURAL_HIVE_LAYER: "ml-pipeline"
  # Inference cache
  CACHE_TTL_SECONDS: "3600"
  # External service endpoints (in-cluster DNS)
  REDIS_URL: "redis://neural-hive-cache.redis-cluster.svc.cluster.local:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "neural-hive-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-api
  namespace: neural-hive
  labels:
    app: ml-inference-api
    component: ml-inference
    neuralhive/layer: ml-pipeline
    neuralhive/phase: phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-inference-api
  template:
    metadata:
      labels:
        app: ml-inference-api
        app.kubernetes.io/name: ml-inference-api
        app.kubernetes.io/instance: ml-inference-api
        component: ml-inference
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ml-inference-api
          image: ghcr.io/albinojimy/neural-hive-mind/ml-inference-api:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8020
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ml-inference-api-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8020
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-api
  namespace: neural-hive
  labels:
    app: ml-inference-api
    component: ml-inference
spec:
  selector:
    app: ml-inference-api
  ports:
    - name: http
      port: 8020
      targetPort: 8020
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-inference-api-hpa
  namespace: neural-hive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-inference-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
