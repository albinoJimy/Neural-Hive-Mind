apiVersion: v1
kind: Namespace
metadata:
  name: pii
  labels:
    name: pii
    neuralhive/layer: application
    neuralhive/phase: phase3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pii-service-config
  namespace: pii
data:
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "kubernetes"
  # Neural Hive Observability Metadata
  NEURAL_HIVE_SERVICE_NAME: "pii-service"
  NEURAL_HIVE_COMPONENT: "pii"
  NEURAL_HIVE_LAYER: "specialist"
  # PII Detection Settings
  PRESIDIO_ENABLED: "true"
  SPACY_MODEL_NAME: "pt_core_news_sm"
  CONFIDENCE_THRESHOLD: "0.5"
  # gRPC Settings
  GRPC_MAX_WORKERS: "10"
  GRPC_MAX_RECEIVE_MESSAGE_LENGTH: "104857600"  # 100MB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-service
  namespace: pii
  labels:
    app: pii-service
    component: pii
    neuralhive/layer: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pii-service
  template:
    metadata:
      labels:
        app: pii-service
        app.kubernetes.io/name: pii-service
        app.kubernetes.io/instance: pii-service
        component: pii
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: pii-service
        image: ghcr.io/albinojimy/neural-hive-mind/pii-service:59062e6
        imagePullPolicy: Always
        ports:
        # PORT=8021 é HTTP/REST (FastAPI); GRPC_PORT=9021 é gRPC
        - containerPort: 8021
          name: http
          protocol: TCP
        - containerPort: 9021
          name: grpc
          protocol: TCP
        envFrom:
        - configMapRef:
            name: pii-service-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pii-service
  namespace: pii
  labels:
    app: pii-service
    component: pii
spec:
  selector:
    app: pii-service
  ports:
  - name: http
    port: 8021
    targetPort: 8021
    protocol: TCP
  - name: grpc
    port: 9021
    targetPort: 9021
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pii-service-hpa
  namespace: pii
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pii-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
