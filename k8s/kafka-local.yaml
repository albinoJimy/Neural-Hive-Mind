apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: neural-hive-kafka
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 10Gi
    class: longhorn
    deleteClaim: false
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: neural-hive-kafka
spec:
  replicas: 2
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 50Gi
    class: longhorn
    deleteClaim: false
  resources:
    requests:
      memory: 768Mi
      cpu: 300m
    limits:
      memory: 1536Mi
      cpu: 700m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: neural-hive-kafka
  namespace: kafka
  annotations:
    strimzi.io/kraft: "enabled"
    strimzi.io/node-pools: "enabled"
spec:
  kafka:
    version: 4.1.0
    metadataVersion: 4.1-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      transaction.state.log.min.isr: 2
      default.replication.factor: 2
      min.insync.replicas: 2
  entityOperator:
    topicOperator:
      # CPU aumentado (200m->1000m) para acelerar arranque da JVM e evitar
      # falha da startup probe (connection refused na :8080) sob CPU starvation.
      resources:
        requests:
          memory: 384Mi
          cpu: 250m
        limits:
          memory: 768Mi
          cpu: 1000m
    userOperator:
      resources:
        requests:
          memory: 384Mi
          cpu: 250m
        limits:
          memory: 768Mi
          cpu: 1000m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: intentions.business
  namespace: kafka
  labels:
    strimzi.io/cluster: neural-hive-kafka
spec:
  topicName: intentions.business
  partitions: 3
  replicas: 2
  config:
    retention.ms: 604800000  # 7 days
    segment.bytes: 1073741824
    compression.type: snappy
---
