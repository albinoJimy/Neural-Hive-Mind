# Locust configuration for Doc Ingestion & Data Migration load tests

# Logging configuration
--logfile
logs/locust_run.log

# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
--loglevel
INFO

# Skip SSL verification (for development environments)
# Uncomment for production with proper certificates
# --skip-ssl-verify

# Headless mode configuration (default when using run_load_test.sh)
# --headless
# -u
# 10
# -r
# 1
# -t
# 5m

# Web UI mode configuration
# --web
# --web-port
# 8089
# --web-auth
# user:password

# Results storage
--html
results/load_test_report.html

# CSV output (detailed metrics)
# --csv
# results/doc_ingestion_migration
# --csv-full-history

# Expectations (fail test if criteria not met)
# Use with locust's expect feature
# --expect
# "max-response-time=5000 for 99%"

# Tags (run only specific tasks)
# --tags
# upload,parse
# --exclude-tags
# delete

# Stop timeout (graceful shutdown)
--stop-timeout
10

# Show task ratio (debug)
# --show-task-ratio-json
# results/task_distribution.json
