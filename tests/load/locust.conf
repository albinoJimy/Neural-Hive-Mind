# Locust configuration for Fluxo G load tests

locust:
  host: http://localhost
  users: 100
  spawn_rate: 10
  run_time: 5m

# Development environment
development:
  services:
    requirements_engineering: http://localhost:8010
    documentation_generation: http://localhost:8014
    knowledge_graph_rag: http://localhost:8016
    approval_gateway: http://localhost:8017
  users: 50
  spawn_rate: 5
  run_time: 2m

# Staging environment
staging:
  services:
    requirements_engineering: http://requirements-engineering.staging.neural-hive.local
    documentation_generation: http://documentation-generation.staging.neural-hive.local
    knowledge_graph_rag: http://knowledge-graph-rag.staging.neural-hive.local
    approval_gateway: http://approval-gateway.staging.neural-hive.local
  users: 200
  spawn_rate: 20
  run_time: 10m

# Production environment
production:
  services:
    requirements_engineering: http://requirements-engineering.neural-hive-mind.svc.cluster.local:8010
    documentation_generation: http://documentation-generation.neural-hive-mind.svc.cluster.local:8014
    knowledge_graph_rag: http://knowledge-graph-rag.neural-hive-mind.svc.cluster.local:8016
    approval_gateway: http://approval-gateway.neural-hive-mind.svc.cluster.local:8017
  users: 1000
  spawn_rate: 50
  run_time: 30m

# Stress test configuration
stress:
  users: 5000
  spawn_rate: 500
  run_time: 10m
