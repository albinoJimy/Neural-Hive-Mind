# Docker Compose para Testes E2E da FASE 4
#
# Uso: docker-compose -f tests/e2e/docker-compose.fase4.yml up -d
#      docker-compose -f tests/e2e/docker-compose.fase4.yml down -v

version: "3.8"

services:
  # MongoDB para todos os serviços
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: neural_hive
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - mongodb_data:/data/db

  # Kafka (simplificado para testes)
  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LOG_RETENTION_HOURS: 1
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "bootstrap-server", "localhost:9092", "list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MLflow (simplificado)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    ports:
      - "5000:5000"
    environment:
      BACKEND_STORE_URI: sqlite:///mlflow.db
      DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"

  # Redis para cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Hypothesis Library Service
  hypothesis-library:
    build:
      context: ../../services/hypothesis-library
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: neural_hive
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: DEBUG
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Learning Doc Generator Service
  learning-doc-generator:
    build:
      context: ../../services/learning-doc-generator
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: neural_hive
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      ENABLE_PDF_GENERATION: "false"  # WeasyPrint não instalado em testes
      LOG_LEVEL: DEBUG
    depends_on:
      mongodb:
        condition: service_healthy
      mlflow:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Experiment Impact Analyzer Service
  experiment-impact-analyzer:
    build:
      context: ../../services/experiment-impact-analyzer
      dockerfile: Dockerfile
    ports:
      - "8011:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: neural_hive
      LOG_LEVEL: DEBUG
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:

networks:
  default:
    name: fase4-e2e-network
