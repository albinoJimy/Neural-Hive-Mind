# Docker Compose para testes E2E do Fluxo G
# Inclui todos os serviços necessários para testar o fluxo completo

version: "3.8"

services:
  # Kafka para mensageria
  kafka:
    image: bitnami/kafka:3.5
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_LOG_DIRS=/tmp/kafka/logs

  # MongoDB para persistência
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=secret

  # Neo4j para Knowledge Graph
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]

  # Qdrant para vector search
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  # Redis para cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Temporal Server (simplificado)
  temporal:
    image: temporalio/auto-setup:1.24.0
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - SERVICES=frontend,matching,history,worker

  # Services do Fluxo G
  requirements-engineering:
    build:
      context: ../../services/requirements-engineering
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - REQ_ENG_OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test}
    depends_on:
      - kafka
      - mongodb

  documentation-generation:
    build:
      context: ../../services/documentation-generation
      dockerfile: Dockerfile
    ports:
      - "8014:8014"
    environment:
      - DOC_GEN_OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test}
    depends_on:
      - kafka

  knowledge-graph-rag:
    build:
      context: ../../services/knowledge-graph-rag
      dockerfile: Dockerfile
    ports:
      - "8016:8016"
    environment:
      - KG_RAG_OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test}
      - KG_RAG_NEO4J_URI=bolt://neo4j:7687
      - KG_RAG_NEO4J_USER=neo4j
      - KG_RAG_NEO4J_PASSWORD=password
      - KG_RAG_QDRANT_URL=http://qdrant:6333
    depends_on:
      - neo4j
      - qdrant

  approval-gateway:
    build:
      context: ../../services/approval-gateway
      dockerfile: Dockerfile
    ports:
      - "8017:8017"
    environment:
      - APPROVAL_GW_OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test}
    depends_on:
      - kafka
      - mongodb

  orchestrator-dynamic:
    build:
      context: ../../services/orchestrator-dynamic
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TEMPORAL_HOST=temporal
    depends_on:
      - kafka
      - temporal

  fluxo-g-dashboard:
    build:
      context: ../../services/fluxo-g-dashboard
      dockerfile: Dockerfile
    ports:
      - "8018:8018"
    environment:
      - FLUXO_G_DASHBOARD_ORCHESTRATOR_URL=http://orchestrator-dynamic:8003
    depends_on:
      - orchestrator-dynamic
      - requirements-engineering
      - documentation-generation
      - knowledge-graph-rag
      - approval-gateway

  # E2E Test Runner
  e2e-tests:
    build:
      context: ../../
      dockerfile: tests/e2e/Dockerfile.test
    environment:
      - TEST_TARGET=fluxo-g
    volumes:
      - ./reports:/app/reports
    depends_on:
      - requirements-engineering
      - documentation-generation
      - knowledge-graph-rag
      - approval-gateway
      - orchestrator-dynamic
      - fluxo-g-dashboard
