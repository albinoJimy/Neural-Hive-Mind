# =============================================================================
# Neural Hive-Mind - Configuração de Cobertura de Testes
# =============================================================================
# Configuração centralizada para pytest-cov e coverage.py
# Threshold mínimo: 70% (meta GAP-04)
# =============================================================================

# -----------------------------------------------------------------------------
# [run] - Configurações de execução da cobertura
# -----------------------------------------------------------------------------
[run]
# Fontes a serem cobertas
source =
    libraries/python/neural_hive_specialists
    libraries/python/neural_hive_ml
    libraries/python/neural_hive_resilience
    libraries/python/neural_hive_risk_scoring
    libraries/python/neural_hive_agent_sdk
    libraries/python/neural_hive_observability
    libraries/python/neural_hive_security
    libraries/python/neural_hive_domain
    services

# Arquivos/diretórios a omitir da cobertura
omit =
    */tests/*
    */test_*.py
    */tests_*.py
    */__pycache__/*
    */.venv/*
    */venv/*
    */site-packages/*
    */migrations/*
    */proto_gen/*
    */setup.py
    */conftest.py
    */*.pb2.py
    */*.pb2_grpc.py

# Análise de cobertura de ramificação (branch coverage)
branch = True

# Execução paralela para múltiplos processos
parallel = True
concurrency = multiprocessing

# Plugins
plugins =
    pytest_randomly

# -----------------------------------------------------------------------------
# [report] - Configurações do relatório de cobertura
# -----------------------------------------------------------------------------
[report]
# Precisão das porcentagens (2 casas decimais)
precision = 2

# Mostrar linhas não cobertas no relatório
show_missing = True

# Não pular arquivos com 100% de cobertura
skip_covered = False

# Ordenar por cobertura (menor primeiro)
sort = Cover

# Linhas a excluir da análise de cobertura
exclude_lines =
    # Diretivas pragma
    pragma: no cover
    pragma: nocover

    # Métodos mágicos/dunder
    def __repr__
    def __str__
    def __eq__
    def __hash__

    # Aserções de desenvolvimento
    raise AssertionError
    raise NotImplementedError

    # Main guards
    if __name__ == .__main__.:
    if __name__ == "__main__":

    # Type checking
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:

    # Métodos abstratos
    @abstractmethod
    @abc.abstractmethod

    # Overloads
    @overload
    @typing.overload

    # Retry/backoff logic (difícil de testar determinísticamente)
    await asyncio.sleep
    asyncio.sleep(
    time.sleep(
    tenacity.

    # Decoradores comuns que não executam a função
    @property
    @classmethod
    @staticmethod

    # Exceções de cancelamento
    except asyncio.CancelledError
    except CancelledError

    # Debug/development code
    __debug__
    assert

# Regex para ignorar arquivos completamente
exclude_also =
    # Pass statements em blocos vazios
    pass$

# -----------------------------------------------------------------------------
# [html] - Configurações do relatório HTML
# -----------------------------------------------------------------------------
[html]
# Diretório de saída
directory = htmlcov

# Título do relatório
title = Neural Hive-Mind - Coverage Report

# -----------------------------------------------------------------------------
# [xml] - Configurações do relatório XML (para CI/CD)
# -----------------------------------------------------------------------------
[xml]
# Arquivo de saída
output = coverage.xml

# -----------------------------------------------------------------------------
# [json] - Configurações do relatório JSON
# -----------------------------------------------------------------------------
[json]
# Arquivo de saída
output = coverage.json

# Formato pretty-print
pretty_print = True

# -----------------------------------------------------------------------------
# [logging] - Configurações de logging do coverage
# -----------------------------------------------------------------------------
[logging]
# Verbose para debugging
verbose = False

# -----------------------------------------------------------------------------
# Notas sobre Threshold
# -----------------------------------------------------------------------------
#
# O threshold de 70% é configurado via:
# 1. pytest.ini: --cov-fail-under=70
# 2. .github/workflows/test-coverage.yml: quality-gate job
# 3. scripts/check_coverage.sh: validação local
#
# Para ajustar o threshold global:
# - Modificar pytest.ini: addopts = --cov-fail-under=<NOVO_VALOR>
# - Modificar scripts/check_coverage.sh: REQUIRED_COVERAGE=<NOVO_VALOR>
# - Modificar .github/workflows/test-coverage.yml: REQUIRED_COVERAGE=<NOVO_VALOR>
#
# =============================================================================
