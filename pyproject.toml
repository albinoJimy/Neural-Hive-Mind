# =============================================================================
# Neural-Hive-Mind - Python Configuration
# Centralized configuration for all Python tools
# =============================================================================

[tool.mypy]
# Configuração mypy para Neural Hive-Mind
# Executar: mypy services/ libraries/python/

# Python version
python_version = "3.12"

# Warn about various issues
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

# Disallow incremental typing
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = false  # Gradualmente habilitar
disallow_incomplete_defs = true
check_untyped_defs = true

# Plugins
plugins = [
    "pydantic.mypy"
]

# Follow imports
follow_imports = "normal"
follow_imports_for_stubs = true

# Error reporting
show_error_codes = true
show_column_numbers = true
pretty = true

# Misc
no_implicit_optional = true
warn_no_return = true

# Ignore missing imports de bibliotecas sem stubs
[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "kafka.*",
    "aiokafka.*",
    "motor.*",
    "redis.*",
    "celery.*",
    "neo4j.*",
    "temporal.*",
]
ignore_missing_imports = true

# Ignorar código de terceiros
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# BLACK - Code Formatter
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
  | proto
)/
'''

# =============================================================================
# RUFF - Fast Python Linter
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

# Directories to include
src = ["services", "libraries", "tests"]

# Directories to exclude
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*",  # Django migrations
    "*/proto/*",       # gRPC generated files
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "C90",   # mccabe complexity
    "I",     # isort imports
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate
    "PL",    # pylint
    "TRY",   # tryceratops
    "RUF",   # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by black)
    "E402",   # module level import not at top of file
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "TRY003", # long exception messages
    "EM101",  # raw string in exception
    "EM102",  # f-string in exception
    "S101",   # assert used
    "T201",   # print allowed
    "T203",   # pprint allowed
    "PTH123", # open() allowed
    "ISC001", # single-line implicit string concatenation
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "ARG",     # unused arguments allowed in tests
    "PLR2004", # magic values allowed in tests
]
"__init__.py" = [
    "F401",    # unused imports allowed in __init__.py
]

[tool.ruff.lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 15

[tool.ruff.lint.pycodestyle]
# Maximum docstring line length
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
# Docstring convention
convention = "google"

[tool.ruff.lint.isort]
# Import sorting
known-first-party = ["neural_hive_*"]
combine-as-imports = true

# =============================================================================
# PYTEST - Testing
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "services/*/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--asyncio-mode=auto",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "grpc: marks tests that require gRPC services",
    "kafka: marks tests that require Kafka",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# COVERAGE - Code Coverage
# =============================================================================
[tool.coverage.run]
source = ["services", "libraries"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/proto/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# BANDIT - Security Linter
# =============================================================================
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
]
skips = [
    "B101",   # assert_used (allowed in tests)
    "B601",   # paramiko_calls (false positive)
]
