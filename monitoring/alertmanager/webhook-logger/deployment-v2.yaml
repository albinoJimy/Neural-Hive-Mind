---
# Webhook Logger Service - Recebe notificações do AlertManager
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-logger-config
  namespace: observability
data:
  # Configuração de endpoints de forwarding
  forward.yaml: |
    # Endpoints para onde os alertas serão reenviados
    endpoints:
      critical:
        enabled: false
        type: slack
        url: "https://hooks.slack.com/services/PLACEHOLDER"
        channel: "#nhm-critical"

    # Logging settings
    log_level: info
    log_format: json
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: webhook-logger
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: webhook-logger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: webhook-logger
    app.kubernetes.io/component: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-logger
        app.kubernetes.io/component: alertmanager
        sidecar.istio.io/inject: "false"  # Disable Istio for this pod
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: webhook-logger
        image: python:3.12-slim
        command:
        - /bin/sh
        - -c
        - |
          set -e

          # Install dependencies
          echo "Installing dependencies..."
          pip install --user --no-cache-dir pyyaml && echo "Dependencies installed"
          export PATH=$HOME/.local/bin:$PATH

          # Create the Python script
          cat > /app/server.py << 'PYSCRIPT'
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import logging
          from datetime import datetime
          from urllib.request import Request, urlopen
          import os

          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(levelname)s - %(message)s'
          )
          logger = logging.getLogger('webhook-logger')

          # Metrics
          class Metrics:
              def __init__(self):
                  self.alerts_received = 0
                  self.alerts_forwarded = 0

          metrics = Metrics()

          class AlertHandler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  logger.info(f"{self.address_string()} - {format % args}")

              def do_GET(self):
                  if self.path == '/health':
                      self.send_json({'status': 'healthy', 'timestamp': datetime.now().isoformat()})
                  elif self.path == '/metrics':
                      self.send_metrics()
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)
                  endpoint = self.path.rstrip('/').split('/')[-1]

                  try:
                      alerts = json.loads(body.decode('utf-8'))
                      metrics.alerts_received += len(alerts.get('alerts', []))

                      for alert in alerts.get('alerts', []):
                          status = alert.get('status', 'unknown')
                          alertname = alert.get('labels', {}).get('alertname', 'unknown')
                          severity = alert.get('labels', {}).get('severity', 'unknown')
                          component = alert.get('labels', {}).get('neural_hive_component', 'unknown')
                          summary = alert.get('annotations', {}).get('summary', 'no summary')

                          logger.info(f"ALERT [{status}] {alertname} | {severity} | {component} | {summary}")

                      self.send_json({'status': 'processed', 'count': len(alerts.get('alerts', []))})

                  except Exception as e:
                      logger.error(f"Error processing alert: {e}")
                      self.send_response(500)
                      self.end_headers()

              def send_json(self, data):
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps(data).encode())

              def send_metrics(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(f'''# HELP webhook_logger_alerts_received Total alerts received
          # TYPE webhook_logger_alerts_received counter
          webhook_logger_alerts_received_total {metrics.alerts_received}
          # HELP webhook_logger_alerts_forwarded Total alerts forwarded
          # TYPE webhook_logger_alerts_forwarded counter
          webhook_logger_alerts_forwarded_total {metrics.alerts_forwarded}
          '''.encode())

          if __name__ == '__main__':
              logger.info('Starting webhook-logger on port 8080')
              server = HTTPServer(('0.0.0.0', 8080), AlertHandler)
              server.serve_forever()
          PYSCRIPT

          # Run the server
          echo "Starting webhook-logger..."
          cd /app && python server.py

        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
---
# ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: webhook-logger
    release: neural-hive-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-logger
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
