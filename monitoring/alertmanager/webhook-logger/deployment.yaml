---
# Webhook Logger Service - Recebe notificações do AlertManager
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-logger-config
  namespace: observability
data:
  # Configuração de endpoints de forwarding
  forward.yaml: |
    # Endpoints para onde os alertas serão reenviados
    # Configure conforme necessário (Slack, Discord, PagerDuty, etc.)
    endpoints:
      critical:
        enabled: false
        type: slack
        url: "https://hooks.slack.com/services/PLACEHOLDER"
        channel: "#nhm-critical"

      warning:
        enabled: false
        type: slack
        url: "https://hooks.slack.com/services/PLACEHOLDER"
        channel: "#nhm-alerts"

      nhm:
        enabled: false
        type: discord
        url: "https://discord.com/api/webhooks/PLACEHOLDER"

    # Logging settings
    log_level: info  # debug, info, warn, error
    log_format: json  # json, text
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: webhook-logger
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: webhook-logger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: webhook-logger
    app.kubernetes.io/component: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-logger
        app.kubernetes.io/component: alertmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: webhook-logger
        image: python:3.12-slim
        command:
        - python
        - -c
        - |
          import subprocess
          import sys

          # Install required packages
          subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml", "-q"])

          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          import logging
          from datetime import datetime
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          import yaml

          logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
          logger = logging.getLogger('webhook-logger')

          # Load config
          try:
              with open('/config/forward.yaml', 'r') as f:
                  config = yaml.safe_load(f)
          except:
              config = {'endpoints': {}, 'log_level': 'info', 'log_format': 'json'}

          class AlertHandler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  logger.info(f"{self.address_string()} - {format % args}")

              def do_GET(self):
                  if self.path == '/health':
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'status': 'healthy', 'timestamp': datetime.now().isoformat()}).encode())
                  elif self.path == '/metrics':
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.end_headers()
                      metrics = f'''# HELP webhook_logger_alerts_received Total alerts received
          # TYPE webhook_logger_alerts_received counter
          webhook_logger_alerts_received_total {self.server.alerts_received}
          # HELP webhook_logger_alerts_forwarded Total alerts forwarded
          # TYPE webhook_logger_alerts_forwarded counter
          webhook_logger_alerts_forwarded_total {self.server.alerts_forwarded}
          '''
                      self.wfile.write(metrics.encode())
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_POST(self):
                  content_length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(content_length)

                  # Parse path to determine endpoint type
                  endpoint = self.path.rstrip('/').split('/')[-1]

                  try:
                      alerts = json.loads(body.decode('utf-8'))
                      self.server.alerts_received += 1

                      # Log the alert
                      for alert in alerts.get('alerts', []):
                          status = alert.get('status', 'unknown')
                          alertname = alert.get('labels', {}).get('alertname', 'unknown')
                          severity = alert.get('labels', {}).get('severity', 'unknown')
                          component = alert.get('labels', {}).get('neural_hive_component', 'unknown')
                          summary = alert.get('annotations', {}).get('summary', 'no summary')

                          logger.info(f"ALERT [{status}] {alertname} | {severity} | {component} | {summary}")

                      # Forward to configured endpoint
                      forward_config = config.get('endpoints', {}).get(endpoint, {})
                      if forward_config.get('enabled', False):
                          self.forward_alert(forward_config, alerts)
                          self.server.alerts_forwarded += 1

                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'status': 'processed', 'count': len(alerts.get('alerts', []))}).encode())

                  except Exception as e:
                      logger.error(f"Error processing alert: {e}")
                      self.send_response(500)
                      self.end_headers()

              def forward_alert(self, config, alerts):
                  """Forward alert to external service (Slack, Discord, etc.)"""
                  try:
                      url = config.get('url')
                      endpoint_type = config.get('type', 'slack')

                      if endpoint_type == 'slack':
                          self.send_to_slack(url, alerts, config.get('channel', '#alerts'))
                      elif endpoint_type == 'discord':
                          self.send_to_discord(url, alerts)
                  except Exception as e:
                      logger.error(f"Error forwarding alert: {e}")

              def send_to_slack(self, url, alerts, channel):
                  """Send formatted alert to Slack"""
                  for alert in alerts.get('alerts', []):
                      status = alert.get('status', 'unknown')
                      alertname = alert.get('labels', {}).get('alertname', 'unknown')
                      severity = alert.get('labels', {}).get('severity', 'unknown')
                      summary = alert.get('annotations', {}).get('summary', '')
                      description = alert.get('annotations', {}).get('description', '')

                      emoji = '🚨' if status == 'firing' and severity == 'critical' else \
                              '⚠️' if status == 'firing' and severity == 'warning' else \
                              '✅' if status == 'resolved' else 'ℹ️'

                      payload = {
                          'channel': channel,
                          'username': 'Neural Hive Alertmanager',
                          'icon_emoji': ':warning:',
                          'attachments': [{
                              'color': 'danger' if severity == 'critical' else 'warning' if severity == 'warning' else 'good' if status == 'resolved' else '#808080',
                              'title': f'{emoji} {alertname}',
                              'text': f'*{summary}*\n{description}',
                              'fields': [
                                  {'title': 'Severity', 'value': severity, 'short': True},
                                  {'title': 'Status', 'value': status, 'short': True},
                                  {'title': 'Component', 'value': alert.get('labels', {}).get('neural_hive_component', 'N/A'), 'short': True},
                              ],
                              'footer': 'Neural Hive Mind',
                              'ts': int(datetime.now().timestamp())
                          }]
                      }

                      req = Request(url, json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                      urlopen(req, timeout=5)

              def send_to_discord(self, url, alerts):
                  """Send formatted alert to Discord"""
                  for alert in alerts.get('alerts', []):
                      status = alert.get('status', 'unknown')
                      alertname = alert.get('labels', {}).get('alertname', 'unknown')
                      severity = alert.get('labels', {}).get('severity', 'unknown')
                      summary = alert.get('annotations', {}).get('summary', '')
                      description = alert.get('annotations', {}).get('description', '')

                      color = 0xff0000 if severity == 'critical' else \
                              0xffaa00 if severity == 'warning' else \
                              0x00ff00 if status == 'resolved' else 0x808080

                      payload = {
                          'embeds': [{
                              'title': f'🚔 {alertname}',
                              'description': f'**{summary}**\n{description}',
                              'color': color,
                              'fields': [
                                  {'name': 'Severity', 'value': severity, 'inline': True},
                                  {'name': 'Status', 'value': status, 'inline': True},
                                  {'name': 'Component', 'value': alert.get('labels', {}).get('neural_hive_component', 'N/A'), 'inline': True},
                              ],
                              'timestamp': datetime.now().isoformat()
                          }]
                      }

                      req = Request(url, json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                      urlopen(req, timeout=5)

          class MetricsServer(HTTPServer):
              def __init__(self, *args, **kwargs):
                  self.alerts_received = 0
                  self.alerts_forwarded = 0
                  super().__init__(*args, **kwargs)

          if __name__ == '__main__':
              server = MetricsServer(('0.0.0.0', 8080), AlertHandler)
              logger.info('Webhook Logger started on port 8080')
              server.serve_forever()

        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: webhook-logger-config
      securityContext:
        fsGroup: 1000
---
# ServiceMonitor para expor métricas do webhook-logger
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webhook-logger
  namespace: observability
  labels:
    app.kubernetes.io/name: webhook-logger
    release: neural-hive-prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-logger
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-logger
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook-logger
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 8080
