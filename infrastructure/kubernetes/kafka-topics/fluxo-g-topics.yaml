---
# Tópico 10: Pipeline Completed
# Eventos finais de pipeline completado com sucesso
# Compact key retention para manter último estado
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxo-g-pipeline-completed
  namespace: neural-hive-mind
  labels:
    strimzi.io/cluster: neural-hive-mind-kafka
    app: fluxo-g
    component: orchestrator
spec:
  partitions: 3
  replicas: 2
  config:
    retention.ms: 2592000000  # 30 dias
    cleanup.policy: compact  # Manter último valor por key
    compression.type: lz4
    min.insync.replicas: 1

---
