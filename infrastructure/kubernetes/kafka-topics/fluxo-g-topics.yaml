# Kafka Topics para Fluxo G Pipeline
#
# Este arquivo define todos os tópicos Kafka necessários para o Fluxo G,
# incluindo tópicos principais e Dead Letter Topics (DLTs) para retry.
#
# Aplicar: kubectl apply -f infrastructure/kubernetes/kafka-topics/fluxo-g-topics.yaml
#
# Pré-requisitos:
# - Kafka Strimzi operator instalado
# - Cluster Kafka: neural-hive-mind-kafka

---
# Tópico 1: Intent Received
# Recebe intents do usuário para processamento pelo Fluxo G
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxo-g-intent-received
  namespace: neural-hive-mind
  labels:
    strimzi.io/cluster: neural-hive-mind-kafka
    app: fluxo-g
    component: pipeline
spec:
  partitions: 3
  replicas: 2
  config:
    retention.ms: 86400000  # 24 horas
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: 1

---
# Tópico 2: Requirements Generated
# Eventos quando requisitos são gerados (G1)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxo-g-requirements-generated
  namespace: neural-hive-mind
  labels:
    strimzi.io/cluster: neural-hive-mind-kafka
    app: fluxo-g
    component: requirements-engineering
spec:
  partitions: 3
  replicas: 2
  config:
    retention.ms: 604800000  # 7 dias
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: 1

---
# Tópico 3: Architecture Generated
# Eventos quando arquitetura é gerada
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxo-g-architecture-generated
  namespace: neural-hive-mind
  labels:
    strimzi.io/cluster: neural-hive-mind-kafka
    app: fluxo-g
    component: architect-agent
spec:
  partitions: 3
  replicas: 2
  config:
    retention.ms: 604800000  # 7 dias
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: 1

---
# Tópico 4: RAG Queries
# Queries para o Knowledge Graph RAG (G5)
# Mais partições devido ao alto volume de queries
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxo-g-rag-queries
  namespace: neural-hive-mind
  labels:
    strimzi.io/cluster: neural-hive-mind-kafka
    app: fluxo-g
    component: knowledge-graph-rag
spec:
  partitions: 6  # Mais partições para alta taxa de queries
  replicas: 2
  config:
    retention.ms: 3600000  # 1 hora (queries são efêmeras)
    cleanup.policy: delete
    compression.type: zstd  # Melhor compressão para texto
    min.insync.replicas: 1

---
# Tópico 5: RAG Results
# Resultados das queries RAG
apiVersion: kafka.strimzi.io/v1beta2
