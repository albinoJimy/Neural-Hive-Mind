    strimzi.io/cluster: neural-hive-mind-kafka
    app: fluxo-g
    component: knowledge-graph-rag
spec:
  partitions: 6
  replicas: 2
  config:
    retention.ms: 3600000  # 1 hora
    cleanup.policy: delete
    compression.type: zstd
    min.insync.replicas: 1

---
