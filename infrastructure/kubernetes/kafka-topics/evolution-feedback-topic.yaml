apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: evolution.feedback.topic
  namespace: neural-hive-mind
  labels:
    strimzi.io/cluster: neural-hive-kafka
    component: specialist-evolution
    tier: meta-learning
    app: neural-hive-mind
  annotations:
    description: "Topic para feedback de avaliacoes do Evolution Specialist - usado para meta-learning"
    owner: "specialist-evolution"
    contact: "platform-team@neural-hive-mind.com"
spec:
  partitions: 6
  replicas: 3
  config:
    # Retenção: 30 dias (feedback é valioso para aprendizado de longo prazo)
    retention.ms: 2592000000

    # Segment size: 1 hora (trade-off entre throughput e storage)
    segment.ms: 3600000

    # Compressão: snappy (balance entre CPU e ratio)
    compression.type: snappy

    # Min replicas sync: 2 (garante durabilidade com performance aceitável)
    min.insync.replicas: 2

    # Cleanup policy: delete (remover mensagens antigas baseado em retenção)
    cleanup.policy: delete

    # Flush messages: otimizado para baixa latência
    flush.messages: 10000
    flush.ms: 1000

    # Max message bytes: 10MB (fingerprints + evaluations podem ser grandes)
    max.message.bytes: 10485760

---
