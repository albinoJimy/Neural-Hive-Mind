---
# Secret Management para Experimentos
# Este manifesto define a estratégia de isolamento de secrets para experimentos

---
# Policy para External Secrets Operator
# Define como secrets externos são sincronizados para o namespace de experimentos
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: experiments-secret-store
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
  annotations:
    description: "Store para sincronização de secrets externos para experimentos"
spec:
  # Usar AWS Secrets Manager, Azure Key Vault, ou Vault
  provider:
    # AWS Secrets Manager (configurar conforme ambiente)
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: experiment-pod

---
# Exemplo de ExternalSecret para API Keys de experimentos
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: experiments-api-keys
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
    secret-type: api-keys
  annotations:
    description: "API Keys para serviços externos usados em experimentos"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: experiments-secret-store
    kind: SecretStore
  target:
    name: experiments-api-keys
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: nhm/experiments/openai-api-key
    - secretKey: anthropic-api-key
      remoteRef:
        key: nhm/experiments/anthropic-api-key
    - secretKey: huggingface-token
      remoteRef:
        key: nhm/experiments/huggingface-token

---
# Exemplo de ExternalSecret para credenciais de base de dados
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: experiments-db-credentials
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
    secret-type: database
  annotations:
    description: "Credenciais de base de dados para experimentos (read-only)"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: experiments-secret-store
    kind: SecretStore
  target:
    name: experiments-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        mongodb-uri: "{{ .mongodb_uri }}"
        redis-uri: "{{ .redis_uri }}"
  data:
    - secretKey: mongodb_uri
      remoteRef:
        key: nhm/experiments/mongodb-uri-ro
    - secretKey: redis_uri
      remoteRef:
        key: nhm/experiments/redis-uri-ro

---
# Secret para configuração de registry de imagens (para pull de imagens privadas)
apiVersion: v1
kind: Secret
metadata:
  name: experiments-registry-credentials
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
    secret-type: registry
  annotations:
    description: "Credenciais para pull de imagens de registry privado"
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded docker config JSON
  # .dockerconfigjson: <base64>
  # Substituir com valor real via Helm ou secret-generator

---
# SecretPolicy para controlar que tipos de secrets podem ser criados
# Requer um admission controller customizado (ex: Kyverno)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: experiments-secret-policy
  labels:
    component: safe-experimentation
    tier: secret-policy
  annotations:
    description: "Política para garantir secrets de experimentos seguem padrões de segurança"
spec:
  validationFailureAction: audit  # Mudar para enforce após validação
  background: true
  rules:
    - name: require-external-secrets
      match:
        any:
          - resources:
              kinds:
                - Secret
              namespaces:
                - nhm-experiments
      validate:
        message: "Secrets no namespace de experimentos devem usar ExternalSecret ou ser do tipo kubernetes.io/*"
        pattern:
          metadata:
            annotations:
              experiments.nhm.is/managed-by: "*"
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: In
            values:
              - CREATE
              - UPDATE

    - name: prohibit-secrets-in-spec
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - Job
                - CronJob
              namespaces:
                - nhm-experiments
      validate:
        message: "Não é permitido incluir secrets diretamente no spec (use volume mounts ou envFrom)"
        deny:
          - conditions:
              all:
                - key: "{{ request.object.spec.[].valueFrom.secretKeyRef }}"
                  operator: AnyExists

---
# ConfigMap com configurações de rotação de secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: experiments-secret-rotation-config
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
  annotations:
    description: "Configurações para rotação automática de secrets"
data:
  # Intervalos de rotação por tipo de secret
  rotation_intervals.yaml: |
    api_keys:
      interval: 90d  # Dias
      grace_period: 7d
    database_credentials:
      interval: 180d
      grace_period: 14d
    registry_credentials:
      interval: 365d
      grace_period: 30d
    webhook_tokens:
      interval: 30d
      grace_period: 3d

  # Configuração de notificações
  notifications.yaml: |
    enabled: true
    channels:
      - type: slack
        webhook: "${SLACK_WEBHOOK_URL}"
      - type: kafka
        topic: "nhm.security.secret-rotation"
    notify_before:
      - 7d
      - 3d
      - 1d

---
# CronJob para verificação de expiração de secrets
apiVersion: batch/v1
kind: CronJob
metadata:
  name: experiments-secret-expiry-check
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
    job-type: expiry-check
  annotations:
    description: "Verifica expiração de secrets e notifica antes da rotação"
spec:
  schedule: "0 9 * * *"  # Diariamente às 9h
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: experiment-pod
          restartPolicy: OnFailure
          containers:
            - name: expiry-checker
              image: ghcr.io/external-secrets/external-secrets:v0.9.0
              command:
                - /bin/sh
                - -c
                - |
                  #!/bin/sh
                  echo "Checking secret expiry in nhm-experiments namespace..."
                  # Verificar secrets com annotations de expiração
                  kubectl get secrets -n nhm-experiments \
                    -o=jsonpath='{range .items[?(@.metadata.experiments\.nhm\.is/expires-at)]}{.metadata.name}{"\t"}{.metadata.experiments\.nhm\.is/expires-at}{"\n"}{end}'
                  exit 0
              env:
                - name: KUBERNETES_SERVICE_HOST
                  value: "kubernetes.default.svc"
                - name: KUBERNETES_SERVICE_PORT
                  value: "443"

---
# NetworkPolicy para limitar acesso a secret store (se aplicável)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experiments-secret-store-policy
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
    policy-type: secret-store-access
  annotations:
    description: "Limita acesso a serviços de secret store externos"
spec:
  podSelector:
    matchLabels:
      experiments.nhm.is/accesses-external-secrets: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        # AWS Secrets Manager endpoint
        - ipBlock:
            cidr: 10.0.0.0/8  # Ajustar conforme cloud provider
      ports:
        - protocol: TCP
          port: 443

---
# LimitRange específico para recursos relacionados a secrets
# Evita que pods de secret sync consumam muitos recursos
apiVersion: v1
kind: LimitRange
metadata:
  name: experiments-secret-limits
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: secret-management
    resource-type: secret-sync
  annotations:
    description: "Limites de recursos para pods de sincronização de secrets"
spec:
  limits:
    - type: Container
      default:
        cpu: "50m"
        memory: "64Mi"
      defaultRequest:
        cpu: "25m"
        memory: "32Mi"
      max:
        cpu: "200m"
        memory: "256Mi"

---
# Role adicional para gestão de secrets (para admins de experimentos)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: experiments-secret-admin
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: rbac
    role-type: secret-admin
  annotations:
    description: "Permissões para gestão de secrets no namespace de experimentos"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets/status", "secretstores/status"]
    verbs: ["get", "watch"]

---
# RoleBinding para secret admins
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: experiments-secret-admin-binding
  namespace: nhm-experiments
  labels:
    component: safe-experimentation
    tier: rbac
    binding-type: secret-admin
  annotations:
    description: "Vincula administradores de secrets ao namespace de experimentos"
subjects:
  - kind: Group
    name: "nhm-platform-admins"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: experiments-secret-admin
  apiGroup: rbac.authorization.k8s.io
