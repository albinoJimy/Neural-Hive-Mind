# FluxCD GitOps Toolkit - Dev Cluster
# Componentes base do FluxCD para Neural Hive-Mind (Desenvolvimento)
#
# Ambiente: Development/Testing
# Branch: develop
# Sync Interval: Mais frequente para feedback rápido

---
# Namespace para componentes do FluxCD
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Source Controller - Gerencia fontes externas (Git, Helm, OCI)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: neural-hive-mind
  namespace: flux-system
spec:
  interval: 30s
  url: ssh://git@github.com/albinoJimy/Neural-Hive-Mind.git
  ref:
    branch: develop
  secretRef:
    name: neural-hive-mind-git-ssh
  ignore: |
    # exclude all
    /*
    # include deploy dir
    !/infrastructure/fluxcd
    !/helm-charts
  gitImplementation: go-git
  timeout: 60s

---
# Kustomization para infraestrutura base
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/infrastructure
  prune: true
  wait: false
  healthChecks:
    - apiVersion: v1
      kind: ConfigMap
      name: kafka-config
      namespace: neural-hive-dev

---
# Kustomization para serviços core
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-services
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/services
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gateway-intencoes
      namespace: neural-hive-dev

---
# Kustomization para especialistas
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: specialists
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/specialists
  prune: true
  wait: true
  dependsOn:
    - name: core-services

---
# Kustomization para agentes
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/agents
  prune: true
  wait: true
  dependsOn:
    - name: core-services

---
# Helm Repository para charts locais
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: neural-hive-mind-charts
  namespace: flux-system
spec:
  interval: 1m
  url: file:///helm-charts
