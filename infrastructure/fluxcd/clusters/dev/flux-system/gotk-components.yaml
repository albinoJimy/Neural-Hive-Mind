# FluxCD GitOps Toolkit - Dev Cluster
# Componentes base do FluxCD para Neural Hive-Mind (Desenvolvimento)
#
# Ambiente: Development/Testing
# Branch: develop
# Sync Interval: Mais frequente para feedback rápido

---
# Namespace para componentes do FluxCD
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Source Controller - Gerencia fontes externas (Git, Helm, OCI)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: neural-hive-mind
  namespace: flux-system
spec:
  interval: 30s
  url: ssh://git@github.com/albinoJimy/Neural-Hive-Mind.git
  ref:
    branch: develop
  secretRef:
    name: neural-hive-mind-git-ssh
  ignore: |
    # exclude all
    /*
    # include deploy dir
    !/infrastructure/fluxcd
    !/helm-charts
    !/k8s
  gitImplementation: go-git
  timeout: 60s

---
# Kustomization para infraestrutura base
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/infrastructure
  prune: true
  wait: false

---
# Kustomization para serviços core
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-services
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/services
  prune: true
  dependsOn:
    - name: infrastructure

---
# Kustomization para especialistas
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: specialists
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/specialists
  prune: true
  dependsOn:
    - name: core-services

---
# Kustomization para agentes
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/dev/agents
  prune: true
  dependsOn:
    - name: core-services

---
# ImageRepository para GHCR - Dev usa tags latest/dev
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gateway-intencoes
  namespace: flux-system
spec:
  image: ghcr.io/albinojimy/neural-hive-mind/gateway-intencoes
  interval: 1m
  secretRef:
    name: ghcr-credentials

---
# ImagePolicy para Dev - Usa tag mais recente (sem validação semver)
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gateway-intencoes-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gateway-intencoes
  policy:
    alphabetical:
      order: desc
