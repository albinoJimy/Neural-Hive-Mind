# ImageRepositories e ImagePolicies para Ambiente Dev
# Atualização automática de imagens do GHCR

---
# ImageRepository para Gateway Intenções
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gateway-intencoes
  namespace: flux-system
spec:
  image: ghcr.io/albinojimy/neural-hive-mind/gateway-intencoes
  interval: 1m
  secretRef:
    name: ghcr-credentials

---
# ImagePolicy para Gateway Intenções - Dev (latest)
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gateway-intencoes-dev
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gateway-intencoes
  policy:
    alphabetical:
      order: desc

