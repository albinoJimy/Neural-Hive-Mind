---
# ImageUpdateAutomation para Dev
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: dev-auto-update
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  gitCheckout:
    ref:
      branch: develop
  update:
    path: ./infrastructure/fluxcd/clusters/dev
    strategy: Setters
  commit:
    authorName: fluxcdbot
    authorEmail: fluxcdbot@neural-hive-mind.org
    message.template: |
      Auto-update dev images: {{range .Updated.Images}}{{println .}}{{end}}
  push:
    branch: develop
