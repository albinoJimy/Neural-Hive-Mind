# Kustomization para FluxCD - Development Environment
# Aplica todos os recursos do FluxCD para o cluster de desenvolvimento

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flux-system

# Recursos base do FluxCD
resources:
  # Componentes base (gotk-components.yaml já inclui namespace)
  - gotk-components.yaml
  # Repositórios de imagens
  - image-repositories.yaml
  # Política de promoção
  - promotion-policy.yaml
  # Notificações Slack
  - notifications.yaml
  # Secrets (secrets.yaml deve ser gerido via SOPS/External Secrets)
  - secrets.yaml

# Labels adicionais para todos os recursos
commonLabels:
  environment: dev
  gitops: fluxcd
  cluster: neural-hive-mind-dev

# Anotações comuns
commonAnnotations:
  docs.fluxcd.io/source: "https://fluxcd.io/docs/"
  docs.nhm.local: "/infrastructure/fluxcd/docs/"
