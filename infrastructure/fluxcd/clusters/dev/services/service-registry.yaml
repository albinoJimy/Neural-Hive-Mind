# HelmRelease para Service Registry - Dev
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: service-registry
  namespace: neural-hive-dev
spec:
  interval: 2m
  timeout: 5m
  chart:
    spec:
      chart: ./helm-charts/service-registry
      sourceRef:
        kind: GitRepository
        name: neural-hive-mind
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/albinojimy/neural-hive-mind/service-registry
      tag: "dev"
      pullPolicy: Always
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    autoscaling:
      enabled: false
    environment:
      MONGODB_URL: "mongodb://mongodb-dev-0.mongodb-dev.neural-hive-dev.svc.cluster.local:27017"
      REDIS_URL: "redis://redis-dev.neural-hive-dev.svc.cluster.local:6379"
      LOG_LEVEL: "DEBUG"
    labels:
      mongodb-access: "true"
      redis-access: "true"
    livenessProbe:
      httpGet:
        path: /health
        port: 8007
      initialDelaySeconds: 10
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /ready
        port: 8007
      initialDelaySeconds: 5
      periodSeconds: 3
