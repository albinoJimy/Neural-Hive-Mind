# HelmRelease para Semantic Translation Engine - Prod
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: semantic-translation-engine
  namespace: neural-hive-prod
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: ./helm-charts/semantic-translation-engine
      sourceRef:
        kind: GitRepository
        name: neural-hive-mind
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/albinojimy/neural-hive-mind/semantic-translation-engine
      tag: "v1.0.0" # {"$imagepolicy": "flux-system:semantic-translation-engine-prod:tag"}
      pullPolicy: IfNotPresent
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka.neural-hive-prod.svc.cluster.local:9092"
      MONGODB_URL: "mongodb://mongodb-prod-0.mongodb-prod.neural-hive-prod.svc.cluster.local:27017"
      REDIS_URL: "redis://redis-prod.neural-hive-prod.svc.cluster.local:6379"
      LOG_LEVEL: "WARN"
    labels:
      kafka-access: "true"
      mongodb-access: "true"
      redis-access: "true"
    livenessProbe:
      httpGet:
        path: /health
        port: 8001
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /ready
        port: 8001
      initialDelaySeconds: 20
      periodSeconds: 10
