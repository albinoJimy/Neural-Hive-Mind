# Kustomization para Infraestrutura Base - Production
# Configura serviços de infraestrutura: observabilidade, segurança, networking

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neural-hive-prod

resources:
  - namespace.yaml
  - network-policies.yaml
  - configmaps.yaml

configMapGenerator:
  - name: flux-settings
    literals:
      - ENVIRONMENT=production
      - CLUSTER=neural-hive-prod
      - LOG_LEVEL=warn
      - GITOPS_SYNC_INTERVAL=manual

  - name: global-config
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=kafka.neural-hive-prod.svc.cluster.local:9092
      - MONGODB_URL=mongodb://mongodb-prod-0.mongodb-prod.neural-hive-prod.svc.cluster.local:27017
      - REDIS_URL=redis://redis-prod.neural-hive-prod.svc.cluster.local:6379
      - TEMPORAL_HOST=temporal.neural-hive-prod.svc.cluster.local:7233
      - NEO4J_URI=bolt://neo4j.neural-hive-prod.svc.cluster.local:7687

secretGenerator:
  - name: global-secrets
    envs:
      - .env.secrets
    options:
      disableNameSuffixHash: false
