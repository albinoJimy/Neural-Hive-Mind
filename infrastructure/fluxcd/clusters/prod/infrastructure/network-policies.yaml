---
# Permitir comunicação com Temporal
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-temporal
  namespace: neural-hive-prod
spec:
  podSelector:
    matchLabels:
      temporal-access: "true"
