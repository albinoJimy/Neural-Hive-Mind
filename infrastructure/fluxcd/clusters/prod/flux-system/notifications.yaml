# FluxCD Notifications - Production Environment
# Configuração de notificações Slack para ambiente de produção
#
# Ambiente: Production
# Canal Slack: #nhm-gitops-prod
# Eventos: APENAS erros críticos e drift (sem spam de info)
#
# PRIORIDADE: Alta prioridade para notificações críticas apenas

---
# Secret para Slack webhook
# ATENÇÃO: O webhookUrl deve ser configurado via SOPS ou External Secrets
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: flux-system
type: Opaque
stringData:
  # Webhook URL do Slack - criar em: https://api.slack.com/messaging/webhooks
  # USE WEBHOOK DEDICADO PARA PRODUÇÃO
  webhookUrl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  username: "FluxCD PROD"
  icon-emoji: ":rotating_light:"
  channel: "#nhm-gitops-prod"

---
# Notification Provider para Slack - Produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Provider
metadata:
  name: slack-prod
  namespace: flux-system
spec:
  type: slack
  channel: nhm-gitops-prod
  secretRef:
    name: slack-webhook
  # Nunca suspender notificações em produção
  suspend: false

---
# ALERTA CRÍTICO: Erros de Kustomization em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: kustomization-critical-errors
  namespace: flux-system
  annotations:
    # Anotação para prioridade alta
    notification/priority: "critical"
    notification/escalation: "on-call"
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
  # Apenas erros críticos em produção
  eventSeverity: error
  eventMetadata:
    env: "prod"
    severity: "critical"
    notification: "kustomization_critical_error"
    escalation: "on-call"
    action_required: "immediate"
  summary: "🚨🚨 ERRO CRÍTICO [PROD]: {{ .Kind }}/{{ .Name }} - INTERVENÇÃO MANUAL NECESSÁRIA"
  timeout: 1m
  # Inhibição para evitar spam
  # FluxCD vai reagendar após timeout se o erro persistir

---
# ALERTA CRÍTICO: Erros de HelmRelease em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: helmrelease-critical-errors
  namespace: flux-system
  annotations:
    notification/priority: "critical"
    notification/escalation: "on-call"
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: HelmRelease
      name: "*"
      namespace: neural-hive-prod
    - kind: HelmRelease
      name: "*"
      namespace: flux-system
  eventSeverity: error
  eventMetadata:
    env: "prod"
    severity: "critical"
    notification: "helmrelease_critical_error"
    escalation: "on-call"
    action_required: "immediate"
  summary: "🚨🚨 ERRO HELM CRÍTICO [PROD]: {{ .Kind }}/{{ .Name }} - INTERVENÇÃO MANUAL NECESSÁRIA"
  timeout: 1m

---
# ALERTA CRÍTICO: Detecção de drift em produção (SECURITY RISK)
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: drift-detection-critical
  namespace: flux-system
  annotations:
    notification/priority: "critical"
    notification/escalation: "security"
    notification/security: "drift"
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: neural-hive-prod
  eventSeverity: error
  eventMetadata:
    env: "prod"
    alert_type: "drift_detected_critical"
    notification: "drift_security"
    escalation: "security-on-call"
    action_required: "immediate"
    security_implication: "configuration_drift_outside_gitops"
  summary: "🚨🚨 DRIFT CRÍTICO [PROD]: {{ .Kind }}/{{ .Name }} - ALTERAÇÃO FORA DO GITOPS DETECTADA"
  timeout: 1m

---
# Alert para eventos de informação (deploy success) - limitado em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: deployment-success-prod
  namespace: flux-system
spec:
  providerRef:
    name: slack-prod
  eventSources:
    # Apenas notificar sucesso de kustomizations principais
    - kind: Kustomization
      name: "core-services"
      namespace: flux-system
    - kind: Kustomization
      name: "specialists"
      namespace: flux-system
  eventSeverity: info
  eventMetadata:
    env: "prod"
    notification: "deployment_success_prod"
  summary: "✅ Deploy bem-sucedido [PROD]: {{ .Kind }}/{{ .Name }}"
  timeout: 5m

---
# Alert para warnings em produção (indicam degradação)
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: health-check-warnings-prod
  namespace: flux-system
  annotations:
    notification/priority: "high"
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: neural-hive-prod
  eventSeverity: warning
  eventMetadata:
    env: "prod"
    notification: "health_warning_prod"
    escalation: "engineering"
  summary: "⚠️ Health check WARNING [PROD]: {{ .Kind }}/{{ .Name }} - investigar"
  timeout: 5m

---
# Alert para eventos de ImageRepository em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: image-repository-events-prod
  namespace: flux-system
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: ImageRepository
      name: "*"
      namespace: flux-system
  eventSeverity: info
  eventMetadata:
    env: "prod"
    notification: "image_repository_prod"
  summary: "📦 Nova imagem disponível [PROD]: {{ .Kind }}/{{ .Name }}"
  timeout: 10m

---
# Alert para promoção staging→prod (evento importante)
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: promotion-events-prod
  namespace: flux-system
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "core-services"
      namespace: flux-system
    - kind: Kustomization
      name: "specialists"
      namespace: flux-system
  eventSeverity: info
  eventMetadata:
    env: "prod"
    notification: "promotion_to_prod"
    action: "staging_to_prod"
    approval: "manual"
  summary: "🚀 Promoção STAGING→PROD: {{ .Kind }}/{{ .Name }}"
  timeout: 3m

---
# Alert para falhas de reconciliação em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: reconciliation-failure-prod
  namespace: flux-system
  annotations:
    notification/priority: "critical"
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: neural-hive-prod
  eventSeverity: error
  eventMetadata:
    env: "prod"
    notification: "reconciliation_failed_prod"
    escalation: "on-call"
    action_required: "immediate"
  summary: "🔴 Falha de reconciliação [PROD]: {{ .Kind }}/{{ .Name }} - VERIFICAR IMEDIATAMENTE"
  timeout: 2m

---
# Alert para eventos de rollback em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: rollback-events-prod
  namespace: flux-system
  annotations:
    notification/priority: "critical"
    notification/incident: "rollback"
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
    - kind: HelmRelease
      name: "*"
      namespace: neural-hive-prod
  eventSeverity: error
  eventMetadata:
    env: "prod"
    notification: "rollback_executed"
    escalation: "management"
    incident_type: "rollback"
  summary: "🔄 ROLLBACK EXECUTADO [PROD]: {{ .Kind }}/{{ .Name }} - INVESTIGAR CAUSA RAIZ"
  timeout: 1m

---
# Alert para notificação de aprovação manual requerida
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: manual-approval-required-prod
  namespace: flux-system
spec:
  providerRef:
    name: slack-prod
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
  eventSeverity: info
  eventMetadata:
    env: "prod"
    notification: "manual_approval_required"
    sync_gate: "enabled"
  summary: "🔐 Aprovação manual requerida [PROD]: {{ .Kind }}/{{ .Name }}"
  timeout: 10m
