# ImageRepositories e ImagePolicies para Ambiente Production
# Atualização controlada com SemVer para produção

---
# ImageRepository para Gateway Intenções
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gateway-intencoes
  namespace: flux-system
spec:
  image: ghcr.io/albinojimy/neural-hive-mind/gateway-intencoes
  interval: 5m
  secretRef:
    name: ghcr-credentials

---
# ImagePolicy para Gateway Intenções - Prod (SemVer)
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gateway-intencoes-prod
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gateway-intencoes
  policy:
    semver:
      range: ">=1.0.0"

