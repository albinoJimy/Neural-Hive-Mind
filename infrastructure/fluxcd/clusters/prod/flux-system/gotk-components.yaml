# FluxCD GitOps Toolkit - Production Cluster
# Componentes base do FluxCD para Neural Hive-Mind (Produção)
#
# Ambiente: Production
# Branch: main
# Sync Interval: Manual (approval required)

---
# Namespace para componentes do FluxCD
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Source Controller - Gerencia fontes externas (Git, Helm, OCI)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: neural-hive-mind
  namespace: flux-system
spec:
  interval: 5m
  url: ssh://git@github.com/albinoJimy/Neural-Hive-Mind.git
  ref:
    branch: main
  secretRef:
    name: neural-hive-mind-git-ssh
  ignore: |
    # exclude all
    /*
    # include deploy dir
    !/infrastructure/fluxcd
    !/helm-charts
  gitImplementation: go-git
  timeout: 120s

---
# Kustomization para infraestrutura base (manual sync)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
  annotations:
    fluxcd.io/sync-gate: "true"  # Requires manual approval
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/prod/infrastructure
  prune: true
  prunePropagationPolicy: foreground
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: v1
      kind: ConfigMap
      name: kafka-config
      namespace: neural-hive-prod

---
# Kustomization para serviços core (manual sync, requires approval)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-services
  namespace: flux-system
  annotations:
    fluxcd.io/sync-gate: "true"  # Requires manual approval
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/prod/services
  prune: true
  prunePropagationPolicy: foreground
  wait: true
  timeout: 10m
  dependsOn:
    - name: infrastructure
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gateway-intencoes
      namespace: neural-hive-prod

---
# Kustomization para especialistas (manual sync)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: specialists
  namespace: flux-system
  annotations:
    fluxcd.io/sync-gate: "true"  # Requires manual approval
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/prod/specialists
  prune: true
  prunePropagationPolicy: foreground
  wait: true
  timeout: 10m
  dependsOn:
    - name: core-services

---
# Kustomization para agentes (manual sync)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agents
  namespace: flux-system
  annotations:
    fluxcd.io/sync-gate: "true"  # Requires manual approval
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: neural-hive-mind
  path: ./infrastructure/fluxcd/clusters/prod/agents
  prune: true
  prunePropagationPolicy: foreground
  wait: true
  timeout: 10m
  dependsOn:
    - name: core-services

---
# Helm Repository para charts locais
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: neural-hive-mind-charts
  namespace: flux-system
spec:
  interval: 10m
  url: file:///helm-charts

---
# Alert para notificações críticas em produção
apiVersion: notification.toolkit.fluxcd.io/v1beta1
kind: Alert
metadata:
  name: production-critical-alerts
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSources:
    - kind: Kustomization
      name: "*"
      namespace: flux-system
  eventSeverity: error
  eventMetadata:
    env: "production"
    cluster: "neural-hive-prod"

---
# Receiver para aprovação manual de production
apiVersion: notification.toolkit.fluxcd.io/v1beta1
kind: Receiver
metadata:
  name: production-approval
  namespace: flux-system
spec:
  type: github
  secretRef:
    name: github-webhook-token
