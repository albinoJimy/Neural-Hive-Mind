# =============================================================================
# EXEMPLO DE LUA SCRIPT PARA REDIS
# =============================================================================

"""
Script Lua para operações atômicas de refill e acquire.
Evita race conditions em cenários de alta concorrência.
"""

REFILL_AND_ACQUIRE_LUA = """
local key = KEYS[1]                          -- Chave do bucket
local capacity = tonumber(ARGV[1])           -- Capacidade máxima
local refill_rate = tonumber(ARGV[2])        -- Taxa de reabastecimento
local tokens_requested = tonumber(ARGV[3])   -- Tokens solicitados
local now = tonumber(ARGV[4])                -- Timestamp atual

-- Obter estado atual
local current = redis.call('HMGET', key, 'tokens', 'last_refill')
local tokens = tonumber(current[1]) or capacity
local last_refill = tonumber(current[2]) or now

-- Calcular reabastecimento
local elapsed = math.max(0, now - last_refill)
local new_tokens = math.min(capacity, tokens + (elapsed * refill_rate))

-- Tentar adquirir tokens
local allowed = new_tokens >= tokens_requested
local remaining = 0
if allowed then
    remaining = new_tokens - tokens_requested
    redis.call('HMSET', key, 'tokens', remaining, 'last_refill', now)
else
    redis.call('HMSET', key, 'tokens', new_tokens, 'last_refill', now)
end

-- Definir TTL (1 hora)
redis.call('EXPIRE', key, 3600)

-- Calcular tempo de espera
local retry_after = 0
if not allowed then
    retry_after = (tokens_requested - new_tokens) / refill_rate
end

-- Retornar: allowed, remaining, retry_after
return {allowed and 1 or 0, remaining, retry_after}
"""

