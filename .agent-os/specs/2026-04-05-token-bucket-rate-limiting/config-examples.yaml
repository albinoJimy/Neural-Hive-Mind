# ============================================================================="""

# Taxa de requisições permitidas por tenant
rate(rate_limit_requests_total{status="allowed"}[5m]) by (tenant_id)

# Taxa de requisições negadas (throttle) por tenant
rate(rate_limit_requests_total{status="denied"}[5m]) by (tenant_id)

# Percentil de tempo de espera por token
histogram_quantile(0.99, sum(rate_limit_wait_duration_seconds) by (tenant_id))

# Tokens restantes por tenant
rate_limit_tokens_remaining{tenant_id="tenant_123"}

# Taxa de throttle events por tier
rate(rate_limit_throttle_total[5m]) by (tier)

# Alerta: alto throttle rate
alert: HighRateLimitThrottle
expr: rate(rate_limit_requests_total{status="denied"}[5m]) > 10
for: 5m
labels:
  severity: warning
annotations:
  summary: "Alta taxa de throttle para tenant {{ $labels.tenant_id }}"
  description: "{{ $value }} requests/sec sendo negados"
"""

