"""
Estrutura de configuração para endpoints específicos.
Localização: src/config/rate_limit_config.py
"""

from dataclasses import dataclass
from typing import NotRequired

@dataclass
class RateLimitConfig:
    """Configuração de rate limit para um endpoint."""
    capacity: int           # Capacidade máxima do bucket
    refill_rate: float      # Taxa de reabastecimento (tokens/segundo)
    burst_multiplier: float = 2.0  # Multiplicador para burst (padrão: 2.0)

    @property
    def burst_capacity(self) -> int:
        """Capacidade de burst (tokens máximos acumuláveis)."""
        return int(self.capacity * self.burst_capacity)


