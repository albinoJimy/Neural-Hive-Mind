version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  # gateway-api temporarily disabled - using unified-gateway instead
  # TODO: Create Dockerfile.test for gateway-intencoes or migrate tests to unified-gateway
  # gateway-api:
  #   build:
  #     context: ./services/gateway-intencoes
  #     dockerfile: Dockerfile
  #   container_name: gateway-api
  #   depends_on:
  #     - kafka
  #     - redis
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     KAFKA_BROKERS: kafka:29092
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     LOG_LEVEL: DEBUG
  #     PORT: 8080
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

  # Scout MCP Server - Descoberta de código
  scout-mcp-server:
    build:
      context: ./services/mcp-servers
      dockerfile: scout-mcp-server/Dockerfile
    container_name: scout-mcp-server
    ports:
      - "3010:3010"
    environment:
      LOG_LEVEL: DEBUG
      PORT: 3010
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optimizer MCP Server - Otimização de código
  optimizer-mcp-server:
    build:
      context: ./services/mcp-servers
      dockerfile: optimizer-mcp-server/Dockerfile
    container_name: optimizer-mcp-server
    ports:
      - "3011:3011"
    environment:
      LOG_LEVEL: DEBUG
      PORT: 3011
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  default:
    name: neural-network