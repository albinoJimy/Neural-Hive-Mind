apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxo-g-dashboard
  namespace: neural-hive-mind
  labels:
    app: fluxo-g-dashboard
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluxo-g-dashboard
  template:
    metadata:
      labels:
        app: fluxo-g-dashboard
        version: v0.1.0
    spec:
      containers:
      - name: fluxo-g-dashboard
        image: nhm/fluxo-g-dashboard:v0.1.0
        ports:
        - containerPort: 8018
          name: http
        env:
        - name: FLUXO_G_DASHBOARD_TEMPORAL_HOST
          value: "temporal-frontend.temporal.svc.cluster.local"
        - name: FLUXO_G_DASHBOARD_ORCHESTRATOR_URL
          value: "http://orchestrator-dynamic:8003"
        - name: FLUXO_G_DASHBOARD_REQUIREMENTS_URL
          value: "http://requirements-engineering:8010"
        - name: FLUXO_G_DASHBOARD_DOCUMENTATION_URL
          value: "http://documentation-generation:8014"
        - name: FLUXO_G_DASHBOARD_KNOWLEDGE_GRAPH_URL
          value: "http://knowledge-graph-rag:8016"
        - name: FLUXO_G_DASHBOARD_APPROVAL_URL
          value: "http://approval-gateway:8017"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8018
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8018
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fluxo-g-dashboard
  namespace: neural-hive-mind
  labels:
    app: fluxo-g-dashboard
spec:
  type: LoadBalancer
  ports:
  - port: 8018
    targetPort: 8018
    name: http
  selector:
    app: fluxo-g-dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluxo-g-dashboard
  namespace: neural-hive-mind
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fluxo-g.neural-hive-mind.example.com
    secretName: fluxo-g-dashboard-tls
  rules:
  - host: fluxo-g.neural-hive-mind.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fluxo-g-dashboard
            port:
              number: 8018
