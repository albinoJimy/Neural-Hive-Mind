apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentation-generation
  namespace: neural-hive-mind
  labels:
    app: documentation-generation
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documentation-generation
  template:
    metadata:
      labels:
        app: documentation-generation
        version: v0.1.0
    spec:
      containers:
      - name: documentation-generation
        image: nhm/documentation-generation:v0.1.0
        ports:
        - containerPort: 8014
          name: http
        env:
        - name: DOC_GEN_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8014
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8014
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: documentation-generation
  namespace: neural-hive-mind
  labels:
    app: documentation-generation
spec:
  type: ClusterIP
  ports:
  - port: 8014
    targetPort: 8014
    name: http
  selector:
    app: documentation-generation
