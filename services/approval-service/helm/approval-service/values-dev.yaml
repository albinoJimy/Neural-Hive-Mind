replicaCount: 1

image:
  tag: "dev"

service:
  type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false

env:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  ENABLE_ML_PREDICTION: "false"
  ENABLE_ACTIVE_LEARNING: "false"
  # Convergência DBs (Fase 2, Task 4): repontado para a DB canónica 'neural_hive_dev'.
  # CONTEXTO HISTÓRICO: a tentativa anterior (f786fb16) de repontar o approval-service
  # sozinho deu HTTP 404 → 0 tickets e foi revertida (6fddd01d) — PORQUE o corpus
  # (plan_approvals, specialist_feedback, specialist_opinions) ainda vivia em
  # 'neural_hive' e neural_hive_dev estava vazio. Esse aviso DEIXOU DE SER VERDADEIRO:
  # a Fase 1 (Tasks 2+3) migrou o corpus para neural_hive_dev (plan_approvals 486 +
  # specialist_feedback 2482 + specialist_opinions, contagens copiadas==origem,
  # ver docs/specs/2026-06-21-convergencia-dbs/sub-specs/fase1-evidence.md). Com os
  # dados já presentes no alvo, o repoint é seguro (regra de ouro: dados primeiro,
