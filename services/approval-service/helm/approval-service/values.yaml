replicaCount: 2

image:
  repository: 37.60.241.150:30500/approval-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http: 8080
    metrics: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  SERVICE_NAME: approval-service
  SERVICE_VERSION: 1.0.0
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP_ID: approval-service
  KAFKA_APPROVAL_REQUESTS_TOPIC: cognitive-plans-approval-requests
  KAFKA_APPROVAL_RESPONSES_TOPIC: cognitive-plans-approval-responses
  MONGODB_URI: mongodb://mongodb:27017
  MONGODB_DATABASE: neural_hive
  MONGODB_COLLECTION: plan_approvals
  ENABLE_ML_PREDICTION: "true"
  ML_MODEL_PATH: /app/models
  ML_AUTO_APPROVE_THRESHOLD: "0.85"
  ML_AUTO_REJECT_THRESHOLD: "0.25"
  ENABLE_FEEDBACK_COLLECTION: "true"
  ENABLE_ACTIVE_LEARNING: "true"
  ACTIVE_LEARNING_MIN_INFORMATION_VALUE: "0.5"
  ACTIVE_LEARNING_ENQUEUE_RATE: "0.2"
  OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317

secrets:
  mongodb_uri: ""
  kafka_sasl_username: ""
  kafka_sasl_password: ""
  ml_model_secret: ""

serviceAccount:
  create: true
  name: approval-service

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - approval-service
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []
