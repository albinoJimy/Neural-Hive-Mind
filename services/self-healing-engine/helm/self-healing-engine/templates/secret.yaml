{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "self-healing-engine.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "self-healing-engine.labels" . | nindent 4 }}
type: Opaque
data:
  # MongoDB Credentials (base64 encoded)
  mongodb-username: {{ .Values.secret.mongodbUsername | quote }}
  mongodb-password: {{ .Values.secret.mongodbPassword | quote }}

  # Service Registry Credentials
  {{- if .Values.secret.serviceRegistryToken }}
  service-registry-token: {{ .Values.secret.serviceRegistryToken | quote }}
  {{- end }}

  # Orchestrator TLS Credentials
  {{- if .Values.secret.orchestratorTlsCert }}
  orchestrator-tls-cert: {{ .Values.secret.orchestratorTlsCert | quote }}
  {{- end }}
  {{- if .Values.secret.orchestratorTlsKey }}
  orchestrator-tls-key: {{ .Values.secret.orchestratorTlsKey | quote }}
  {{- end }}

  # API Keys
  {{- if .Values.secret.apiKey }}
  api-key: {{ .Values.secret.apiKey | quote }}
  {{- end }}
{{- end }}
