apiVersion: v1
kind: Service
metadata:
  name: {{ include "self-healing-engine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "self-healing-engine.labels" . | nindent 4 }}
    app: {{ include "self-healing-engine.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "self-healing-engine.selectorLabels" . | nindent 4 }}
    app: {{ include "self-healing-engine.name" . }}
  ports:
  - name: http
    port: {{ .Values.service.ports.http }}
    targetPort: http
    protocol: TCP
  - name: metrics
    port: {{ .Values.service.ports.metrics }}
    targetPort: metrics
    protocol: TCP
