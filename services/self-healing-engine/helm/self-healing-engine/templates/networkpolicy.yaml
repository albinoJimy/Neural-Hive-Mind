{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "self-healing-engine.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "self-healing-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "self-healing-engine.selectorLabels" . | nindent 6 }}
      app: {{ include "self-healing-engine.name" . }}
  {{- with .Values.networkPolicy.policyTypes }}
  policyTypes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ingress:
  # Permite tráfego HTTP de outros serviços
  - from:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-*
    ports:
    - protocol: TCP
      port: {{ .Values.container.ports.http }}
  # Permite tráfego de métricas para Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: {{ .Values.container.ports.metrics }}
  egress:
  # Permite acesso a MongoDB
  - to:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-*
    ports:
    - protocol: TCP
      port: 27017
  # Permite acesso a Kafka
  - to:
    - namespaceSelector:
        matchLabels:
          name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Permite acesso a Redis
  - to:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-*
    ports:
    - protocol: TCP
      port: 6379
  # Permite acesso a OPA
  - to:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-governance
    ports:
    - protocol: TCP
      port: {{ .Values.services.opa.port | default 8181 }}
  # Permite acesso a Service Registry
  - to:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-governance
    ports:
    - protocol: TCP
      port: {{ .Values.services.serviceRegistry.port | default 8007 }}
  # Permite acesso a Orchestrator (gRPC)
  - to:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-orchestration
    ports:
    - protocol: TCP
      port: {{ .Values.services.orchestrator.port | default 50052 }}
  # Permite acesso a Execution Ticket Service
  - to:
    - namespaceSelector:
        matchLabels:
          name: neural-hive-orchestration
    ports:
    - protocol: TCP
      port: 8000
  # Permite DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Permite acesso ao OTEL Collector
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 4317
{{- end }}
