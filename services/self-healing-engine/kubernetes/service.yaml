apiVersion: v1
kind: Service
metadata:
  name: self-healing-engine
  namespace: neural-hive-orchestration
  labels:
    app: self-healing-engine
    component: governance
    layer: strategic
spec:
  type: ClusterIP
  selector:
    app: self-healing-engine
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: metrics
    protocol: TCP
