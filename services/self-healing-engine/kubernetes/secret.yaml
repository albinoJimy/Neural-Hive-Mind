apiVersion: v1
kind: Secret
metadata:
  name: self-healing-secret
  namespace: neural-hive-orchestration
  labels:
    app: self-healing-engine
    component: governance
type: Opaque
data:
  # MongoDB Credentials (base64 encoded)
  # Valores placeholder - substituir com valores reais em produção
  mongodb-username: YWRtaW4=  # admin
  mongodb-password: YWRtaW4=  # admin

  # Service Registry Credentials (se necessário)
  service-registry-token: cGxhY2Vob2xkZXI=  # placeholder

  # Orchestrator TLS Credentials (se necessário)
  orchestrator-tls-cert: cGxhY2Vob2xkZXI=  # placeholder
  orchestrator-tls-key: cGxhY2Vob2xkZXI=   # placeholder

  # API Keys para serviços externos (se necessário)
  api-key: cGxhY2Vob2xkZXI=  # placeholder
---
# Nota: Em produção, usar secrets management tools como:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Kubernetes External Secrets Operator
