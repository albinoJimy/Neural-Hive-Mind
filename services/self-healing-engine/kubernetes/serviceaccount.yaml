apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-engine
  namespace: neural-hive-orchestration
  labels:
    app: self-healing-engine
    component: governance
    layer: strategic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-engine
  namespace: neural-hive-orchestration
  labels:
    app: self-healing-engine
    component: governance
rules:
  # Permite ler pods e pods metrics para detecção de problemas
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # Permite ler e deletar pods para recuperação
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "create"]

  # Permite ler ConfigMaps e Secrets
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]

  # Permite ler eventos para debugging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create"]

  # Permite ler deployments para health checks
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

  # Permite ler/metricas de pods
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-engine
  namespace: neural-hive-orchestration
  labels:
    app: self-healing-engine
    component: governance
subjects:
  - kind: ServiceAccount
    name: self-healing-engine
    namespace: neural-hive-orchestration
roleRef:
  kind: Role
  name: self-healing-engine
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healing-engine
  labels:
    app: self-healing-engine
    component: governance
rules:
  # Permite ler nodes para node-level health checks
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Permite ler namespaces para cross-namespace operations
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

  # Permite ler custom resources (se necessário)
  - apiGroups: ["custom.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healing-engine
  labels:
    app: self-healing-engine
    component: governance
subjects:
  - kind: ServiceAccount
    name: self-healing-engine
    namespace: neural-hive-orchestration
roleRef:
  kind: ClusterRole
  name: self-healing-engine
  apiGroup: rbac.authorization.k8s.io
