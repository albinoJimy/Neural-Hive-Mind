apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "software-engineering-pipeline.fullname" . }}-test-connection"
  labels:
    {{- include "software-engineering-pipeline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--spider'
        - '--timeout=5'
        - '{{ include "software-engineering-pipeline.fullname" . }}:{{ .Values.service.port }}/health'
      restartPolicy: Never
