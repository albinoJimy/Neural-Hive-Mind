# Valores padrão para software-engineering-pipeline
# Esta é uma versão simplificada adequada para deploy local ou testes

replicaCount: 1

image:
  repository: software-engineering-pipeline
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8008

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: pipeline.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Configurações do serviço
env:
  log_level: INFO
  environment: dev

# Configurações de infraestrutura
mongodb:
  enabled: true
  url: "mongodb://mongodb:27017"
  db_name: "pipeline_db"

kafka:
  enabled: true
  bootstrap_servers: "kafka:9092"
  group_id: "pipeline-service"

# OpenTelemetry
otel:
  enabled: false
  endpoint: ""

# Integrações com serviços externos
github:
  token: ""
  appId: ""
  appPrivateKey: ""

gitlab:
  token: ""
  url: "https://gitlab.com"

jenkins:
  url: ""
  username: ""
  password: ""

argocd:
  url: ""
  token: ""
  namespace: "argocd"

# Configurações de inteligência
anomaly_detection:
  enabled: true
  threshold: 0.7

flaky_test_threshold: 3
insights_retention_days: 90

# Orquestração
default_timeout_minutes: 60
max_retries: 3
rollback_on_health_check_failure: true
rollback_on_metrics_degradation: true
