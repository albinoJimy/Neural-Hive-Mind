[tool.poetry]
name = "data-migration"
version = "1.0.0"
description = "Data Migration System for Neural Hive-Mind Fluxo H"
authors = ["Neural Hive-Mind Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
motor = "^3.3.2"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
redis = {extras = ["hiredis"], version = "^5.0.1"}
aiokafka = "^0.9.0"
structlog = "^23.2.0"
openai = "^1.7.2"
anthropic = "^0.18.0"
boto3 = "^1.34.0"
minio = "^7.2.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
opentelemetry-instrumentation-httpx = "^0.42b0"
opentelemetry-exporter-otlp = "^1.21.0"

# Data validation
great-expectations = "^0.18.0"

# CDC connectors
debezium-connector = {path = "../../libraries/debezium-connector", develop = true}

# Neural Hive-Mind integration
neural-hive-integration = {path = "../../libraries/neural_hive_integration", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
ruff = "^0.1.8"
black = "^23.12.1"
mypy = "^1.7.1"
httpx = "^0.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
