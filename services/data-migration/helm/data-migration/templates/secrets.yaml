apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-migration.fullname" . }}-secrets
  labels:
    {{- include "data-migration.labels" . | nindent 4 }}
type: Opaque
data:
  # API keys e credenciais devem ser fornecidas via helm upgrade --set-file ou inline
  # Exemplo: --set secrets.openaiApiKey="your-api-key-here"
  openai-api-key: {{ .Values.secrets.openaiApiKey | default "" | b64enc | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | default "" | b64enc | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | default "" | b64enc | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | default "" | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | default "" | b64enc | quote }}
