apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-migration
  namespace: neural-hive-mind
  labels:
    app: data-migration
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-migration
  template:
    metadata:
      labels:
        app: data-migration
        version: v1.0.0
    spec:
      containers:
      - name: data-migration
        image: nhm/data-migration:v1.0.0
        ports:
        - containerPort: 8019
          name: http
        env:
        - name: DATA_MIGRATION_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: DATA_MIGRATION_MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: mongodb-url
        - name: DATA_MIGRATION_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8019
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8019
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-migration
  namespace: neural-hive-mind
  labels:
    app: data-migration
spec:
  type: ClusterIP
  ports:
  - port: 8019
    targetPort: 8019
    name: http
  selector:
    app: data-migration
