apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-gateway
  namespace: neural-hive-mind
  labels:
    app: approval-gateway
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approval-gateway
  template:
    metadata:
      labels:
        app: approval-gateway
        version: v0.1.0
    spec:
      containers:
      - name: approval-gateway
        image: nhm/approval-gateway:v0.1.0
        ports:
        - containerPort: 8017
          name: http
        env:
        - name: APPROVAL_GW_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: APPROVAL_GW_MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: mongodb-url
        - name: APPROVAL_GW_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8017
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8017
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: approval-gateway
  namespace: neural-hive-mind
  labels:
    app: approval-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8017
    targetPort: 8017
    name: http
  selector:
    app: approval-gateway
