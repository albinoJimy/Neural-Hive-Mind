[tool.ruff]
# Herda configuração do projeto raiz
extend = "../../pyproject.toml"

# Configurações específicas para architect-agent
target-version = "py312"

# Ignorar diretórios duplicados
exclude = [
    ".git",
    "__pycache__",
    "services/architect-agent",
]

[tool.ruff.lint.per-file-ignores]
# Ignorar avisos específicos para testes
"tests/unit/**/*.py" = [
    "ARG",     # unused arguments allowed in tests
    "PLR2004", # magic values allowed in tests
    "PLC0415", # imports inside functions allowed in tests
    "F841",    # unused variables allowed in tests
    "SIM105",  # try-except-pass allowed in tests
    "PT012",   # pytest.raises with multiple statements
    "RET504",  # unnecessary assignment before return
    "B007",    # unused loop variable
    "SIM117",  # nested with statements
    "PTH123",  # os.join allowed
    "TRY002",  # generic exception allowed
    "N802",    # uppercase function name allowed
    "PT001",   # pytest.fixture() without parenthesis
    "PT023",   # pytest.mark without parenthesis
    "PT004",   # fixture without return
]
"tests/integration/**/*.py" = [
    "ARG", "PLR2004", "PLC0415", "F841", "SIM105", "PT012", "RET504",
    "B007", "SIM117", "PTH123", "TRY002", "N802", "PT001", "PT023", "PT004",
]
"tests/e2e/**/*.py" = [
    "ARG", "PLR2004", "PLC0415", "F841", "SIM105", "PT012", "RET504",
    "B007", "SIM117", "PTH123", "TRY002", "N802", "PT001", "PT023", "PT004",
]
"tests/conftest.py" = [
    "ARG", "PLR2004", "PLC0415", "F841", "SIM105", "PT012", "RET504",
    "B007", "SIM117", "PTH123", "TRY002", "N802", "PT001", "PT023", "PT004",
]
"src/**/*.py" = [
    "PLW0603", # global statement allowed for singletons
    "PLR0912", # too many branches allowed
    "W505",    # doc line too long
    "ARG001",  # unused request parameter
    "ARG002",  # unused plan_id parameter
    "ARG004",  # unused component_description parameter
    "PLC0415", # imports inside try-except allowed
    "TRY301",  # abstract raise pattern
    "TRY400",  # logging.exception vs error
    "B904",    # raise from err pattern
    "TRY300",  # else block pattern
    "SIM103",  # return condition directly
    "PLW2901", # loop variable overwritten
    "B015",    # pointless comparison
    "PLR0911", # too many return statements
    "TRY200",  # raise from pattern
    "UP038",   # isinstance with tuple
]
# Ignorar falsos positivos em geradores de código
"src/generators/temporal_generator.py" = [
    "F821",    # undefined name in f-string templates (code generation)
]
"src/config/settings.py" = [
    "N802",    # uppercase property name allowed
]
"src/planners/design_planner.py" = [
    "SIM105",  # try-except-pass for validation
]
"src/repositories/base.py" = [
]
"src/workflows/parallel_workflow.py" = [
    "F601",    # repeated key in dict (temporal workflow)
]
"tests/integration/conftest.py" = [
    "PTH118",  # os.path.join allowed
    "PTH120",  # os.path.dirname allowed
]
