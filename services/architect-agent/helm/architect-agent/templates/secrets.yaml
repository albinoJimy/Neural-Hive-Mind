{{- if .Values.config.llm.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "architect-agent.fullname" . }}-llm
  labels:
    {{- include "architect-agent.labels" . | nindent 4 }}
type: Opaque
data:
  # API key deve ser fornecida via helm upgrade --set-file ou inline
  # Exemplo: --set config.llm.apiKey="your-api-key-here"
  api-key: {{ .Values.config.llm.apiKey | b64enc | quote }}
{{- end }}
