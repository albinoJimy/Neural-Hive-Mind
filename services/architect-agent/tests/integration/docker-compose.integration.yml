version: '3.8'

services:
  # MongoDB - Base de dados principal
  mongodb:
    image: mongo:7.0
    container_name: architect-agent-mongodb-integration
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: architect_agent_test
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - architect-agent-integration

  # Kafka - Mensageria
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: architect-agent-zookeeper-integration
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - architect-agent-integration

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: architect-agent-kafka-integration
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - architect-agent-integration

  # OPA - Open Policy Agent para validação de políticas
  opa:
    image: openpolicyagent/opa:latest
    container_name: architect-agent-opa-integration
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr"
      - "0.0.0.0:8181"
      - "--log-level"
      - "info"
    volumes:
      - ./tests/fixtures/opa-policies:/policies:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - architect-agent-integration

  # Redis - Cache e rate limiting
  redis:
    image: redis:7-alpine
    container_name: architect-agent-redis-integration
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - architect-agent-integration

  # Scout Agents Mock - Simula serviço de descoberta
  scout-agents-mock:
    image: nginx:alpine
    container_name: architect-agent-scout-mock
    ports:
      - "8020:80"
    volumes:
      - ./tests/fixtures/scout-mock:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - architect-agent-integration

volumes:
  mongodb-data:
  redis-data:

networks:
  architect-agent-integration:
    driver: bridge
