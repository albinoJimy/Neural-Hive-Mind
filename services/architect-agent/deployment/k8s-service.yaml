apiVersion: v1
kind: Service
metadata:
  name: architect-agent
  namespace: neural-hive-staging
  labels:
    app: architect-agent
    component: fluxo-g
spec:
  type: ClusterIP
  selector:
    app: architect-agent
  ports:
  - name: http
    port: 8011
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9098
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---

apiVersion: v1
kind: Service
metadata:
  name: architect-agent-headless
  namespace: neural-hive-staging
  labels:
    app: architect-agent
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: architect-agent
  ports:
  - name: http
    port: 8011
    targetPort: http
    protocol: TCP
  sessionAffinity: None
  publishNotReadyAddresses: true
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: architect-agent-ingress
  namespace: neural-hive-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: architect.staging.neural-hive.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: architect-agent
            port:
              number: 8011
  tls:
  - hosts:
    - architect.staging.neural-hive.com
    secretName: architect-agent-tls
---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: architect-agent-pdb
  namespace: neural-hive-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: architect-agent
