apiVersion: apps/v1
kind: Deployment
metadata:
  name: architect-agent
  namespace: neural-hive-staging
  labels:
    app: architect-agent
    component: fluxo-g
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: architect-agent
  template:
    metadata:
      labels:
        app: architect-agent
        component: fluxo-g
        version: v0.2.0
    spec:
      serviceAccountName: architect-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: architect-agent
        image: ghcr.io/albinojimy/neural-hive-mind/architect-agent:v0.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8008
          protocol: TCP
        - name: metrics
          containerPort: 9098
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "INFO"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: architect-agent-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: architect-agent-secrets
              key: anthropic-api-key
              optional: true
        - name: MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: architect-agent-config
              key: mongodb-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: architect-agent-config
              key: redis-url
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: architect-agent-config
              key: neo4j-uri
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: architect-agent
  namespace: neural-hive-staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: architect-agent-config
  namespace: neural-hive-staging
data:
  mongodb-url: "mongodb://mongodb-0.mongodb:27017/architect"
  redis-url: "redis://redis-master:6379/0"
  neo4j-uri: "bolt://neo4j:7687"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: architect-agent-hpa
  namespace: neural-hive-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: architect-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
