apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-generation
  namespace: neural-hive-mind
  labels:
    app: test-generation
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-generation
  template:
    metadata:
      labels:
        app: test-generation
        version: v0.1.0
    spec:
      containers:
      - name: test-generation
        image: nhm/test-generation:v0.1.0
        ports:
        - containerPort: 8013
          name: http
        env:
        - name: TEST_GEN_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: TEST_GEN_MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: mongodb-url
        - name: TEST_GEN_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: bootstrap-servers
        - name: TEST_GEN_KNOWLEDGE_GRAPH_URL
          value: "http://knowledge-graph-rag:8016"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8013
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8013
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-generation
  namespace: neural-hive-mind
  labels:
    app: test-generation
spec:
  type: ClusterIP
  ports:
  - port: 8013
    targetPort: 8013
    name: http
  selector:
    app: test-generation
