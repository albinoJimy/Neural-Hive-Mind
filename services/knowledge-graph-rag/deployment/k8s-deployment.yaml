# Knowledge Graph RAG - Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph-rag
  namespace: neural-hive-mind
  labels:
    app: knowledge-graph-rag
    version: v0.1.0
    component: knowledge-retrieval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-graph-rag
  template:
    metadata:
      labels:
        app: knowledge-graph-rag
        version: v0.1.0
        component: knowledge-retrieval
    spec:
      containers:
      - name: knowledge-graph-rag
        image: nhm/knowledge-graph-rag:v0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8016
          name: http
          protocol: TCP
        env:
        # OpenAI API Key
        - name: KG_RAG_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
              optional: false
        # Neo4j Configuration
        - name: KG_RAG_NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: infrastructure
              key: neo4j-uri
        - name: KG_RAG_NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: neo4j-user
        - name: KG_RAG_NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: neo4j-password
        # Qdrant Configuration
        - name: KG_RAG_QDRANT_HOST
          value: "qdrant"
        - name: KG_RAG_QDRANT_PORT
          value: "6333"
        # Redis Configuration
        - name: KG_RAG_REDIS_HOST
          value: "redis"
        - name: KG_RAG_REDIS_PORT
          value: "6379"
        # Service Configuration
        - name: KG_RAG_HOST
          value: "0.0.0.0"
        - name: KG_RAG_PORT
          value: "8016"
        # LLM Configuration
        - name: KG_RAG_LLM_PROVIDER
          value: "openai"
        - name: KG_RAG_LLM_MODEL
          value: "gpt-4-turbo-preview"
        - name: KG_RAG_EMBEDDING_MODEL
          value: "text-embedding-3-small"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
