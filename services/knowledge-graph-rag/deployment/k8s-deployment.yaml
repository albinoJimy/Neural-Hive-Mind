apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph-rag
  namespace: neural-hive-mind
  labels:
    app: knowledge-graph-rag
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-graph-rag
  template:
    metadata:
      labels:
        app: knowledge-graph-rag
        version: v0.1.0
    spec:
      containers:
      - name: knowledge-graph-rag
        image: nhm/knowledge-graph-rag:v0.1.0
        ports:
        - containerPort: 8016
          name: http
        env:
        - name: KG_RAG_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: KG_RAG_NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: databases-config
              key: neo4j-uri
        - name: KG_RAG_NEO4J_USER
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: neo4j-user
        - name: KG_RAG_NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: neo4j-password
        - name: KG_RAG_QDRANT_URL
          valueFrom:
            configMapKeyRef:
              name: databases-config
              key: qdrant-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-graph-rag
  namespace: neural-hive-mind
  labels:
    app: knowledge-graph-rag
spec:
  type: ClusterIP
  ports:
  - port: 8016
    targetPort: 8016
    name: http
  selector:
    app: knowledge-graph-rag
