[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph-rag"
version = "0.1.0"
description = "Knowledge Graph RAG Service for Neural Hive Mind"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "motor==3.3.2",
    "neo4j==5.14.0",
    "qdrant-client==1.7.0",
    "structlog==23.2.0",
    "openai==1.7.2",
    "anthropic==0.18.0",
    "numpy==1.26.0",
    "sentence-transformers==2.2.2",
    "opentelemetry-api==1.21.0",
    "opentelemetry-sdk==1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
