# Docker Compose para testes E2E de Vault e SPIFFE
# Arquitectura: Vault dev mode, SPIRE server/agent, PostgreSQL
#
# Uso:
#   docker-compose -f docker-compose.e2e.yml up -d
#   ./scripts/setup_vault.sh
#   ./scripts/setup_spire.sh
#   RUN_VAULT_SPIFFE_E2E=true pytest tests/e2e/test_vault_spiffe_e2e.py

version: "3.8"

networks:
  e2e-test:
    driver: bridge

volumes:
  vault-data:
  spire-server:
  spire-agent:
  postgres-data:

services:
  # Vault em modo dev (com UI habilitada)
  vault:
    image: hashicorp/vault:1.15.4
    container_name: nhm-e2e-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "e2e-test-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://localhost:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - e2e-test:
          aliases:
            - vault.neural-hive.local
    volumes:
      - vault-data:/vault/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL para Database secrets engine do Vault
  postgres:
    image: postgres:16-alpine
    container_name: nhm-e2e-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "temporal_admin"
      POSTGRES_PASSWORD: "admin_password_change_me"
      POSTGRES_DB: "temporal"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    networks:
      - e2e-test:
          aliases:
            - postgres.neural-hive.local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal_admin"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SPIRE Server para gestão de identidades SPIFFE
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.8.4
    container_name: nhm-e2e-spire-server
    ports:
      - "8081:8081"
    command:
      - "-config"
      - "/conf/spire-server.conf"
    volumes:
      - ./scripts/spire-server.conf:/conf/spire-server.conf:ro
      - spire-server:/run/spire
    networks:
      - e2e-test:
          aliases:
            - spire-server.neural-hive.local
    depends_on:
      vault:
        condition: service_healthy

  # SPIRE Agent para workload API
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.8.4
    container_name: nhm-e2e-spire-agent
    pid: "host"  # Necessário para Workload API
    network_mode: "service:spire-server"  # Partilhar network para comunicação local
    volumes:
      - ./scripts/spire-agent.conf:/conf/spire-agent.conf:ro
      - spire-agent:/run/spire
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      spire-server:
        condition: service_started

  # Serviço auxiliar para execução de scripts de setup
  setup:
    image: hashicorp/vault:1.15.4
    container_name: nhm-e2e-setup
    networks:
      - e2e-test
    volumes:
      - ./scripts:/scripts:ro
    command:
      - /bin/sh
      - -c
      - |
        echo "Setup container ready. Execute setup scripts manually:"
        echo "  docker exec nhm-e2e-setup /scripts/setup_vault.sh"
        echo "  docker exec nhm-e2e-setup /scripts/setup_spire.sh"
        sleep infinity
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spire-server:
        condition: service_started
