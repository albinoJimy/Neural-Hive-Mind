version: '3.8'

# Docker Compose para testes E2E Vault+SPIFFE
# Execute com: RUN_VAULT_SPIFFE_E2E=true docker-compose -f docker-compose.e2e up -d
# Limpeza: docker-compose -f docker-compose.e2e down -v

services:
  # Vault em modo dev (com UI)
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-e2e
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./scripts/setup_vault.sh:/home/vault/setup_vault.sh:ro
    command: >
      sh -c '
        sleep 5 &&
        apk add --no-cache curl &&
        chmod +x /home/vault/setup_vault.sh &&
        /home/vault/setup_vault.sh &&
        server -dev
      '
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - e2e-network

  # SPIRE Server
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.8.4
    container_name: spire-server-e2e
    ports:
      - "8081:8081"  # HTTP
    volumes:
      - ./scripts/setup_spire.sh:/opt/spire/setup_spire.sh:ro
      - spire-server-data:/opt/spire/data
      - spire-server-conf:/opt/spire/conf
    command: >
      sh -c '
        sleep 5 &&
        chmod +x /opt/spire/setup_spire.sh &&
        /opt/spire/setup_spire.sh &&
        /opt/spire/bin/spire-server run -config /opt/spire/conf/server/server.conf
      '
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f spire-server || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - e2e-network

  # SPIRE Agent
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.8.4
    container_name: spire-agent-e2e
    pid: "host"
    privileged: true
    volumes:
      - /var/run:/var/run
      - ./scripts/spire_agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-agent-socket:/run/spire/sockets
    command: >
      sh -c '
        sleep 10 &&
        until [ -S /run/spire/sockets/agent.sock ]; do sleep 2; done &&
        /opt/spire/bin/spire-agent run -config /opt/spire/conf/agent/agent.conf
      '
    depends_on:
      spire-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/spire/sockets/agent.sock || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - e2e-network

  # PostgreSQL para testar dynamic credentials
  postgres:
    image: postgres:15-alpine
    container_name: postgres-e2e
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - e2e-network

  # Test Runner Container
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: test-runner-e2e
    environment:
      # Vault config
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      VAULT_ROLE: orchestrator
      VAULT_AUTH_PATH: kubernetes
      VAULT_AUTH_METHOD: kubernetes

      # SPIFFE config
      SPIFFE_WORKLOAD_API_SOCKET: unix:///run/spire/sockets/agent.sock
      SPIFFE_TRUST_DOMAIN: neural-hive.local
      SPIFFE_JWT_AUDIENCE: vault.neural-hive.local
      SPIFFE_ENVIRONMENT: development

      # PostgreSQL config
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db

      # Test control
      RUN_VAULT_SPIFFE_E2E: "true"
      PYTEST_LOG_LEVEL: DEBUG
    volumes:
      - .:/app
      - spire-agent-socket:/run/spire/sockets
      - test-results:/app/test-results
    depends_on:
      vault:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: tail -f /dev/null  # Mantém container rodando para testes manuais
    networks:
      - e2e-network

volumes:
  spire-server-data:
  spire-server-conf:
  spire-agent-socket:
  test-results:

networks:
  e2e-network:
    driver: bridge
