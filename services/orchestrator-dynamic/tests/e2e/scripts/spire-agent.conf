# Configuração do SPIRE Agent para testes E2E
#
# Connecta ao SPIRE server em spire-server.neural-hive.local:8081
# Workload API disponível em /tmp/spire-agent.sock

agent {
    server_address = "spire-server.neural-hive.local:8081"
    trust_domain = "neural-hive.local"
    trust_bundle_path = "/run/spire/bundle.crt"
    log_level = "DEBUG"

    // Workload API socket path
    workload_api {
        socket_path = "/tmp/spire-agent.sock"
    }
}

plugins {
    // Node attestation via join token (para testes locais)
    NodeAttestor "join_token" {
        plugin_data {
            # Token gerado pelo servidor: spire-server token generate
            join_token = ""
        }
    }

    KeyManager "memory" {
        plugin_data = {}
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }

    WorkloadAttestor "docker" {
        plugin_data {}
    }
}
