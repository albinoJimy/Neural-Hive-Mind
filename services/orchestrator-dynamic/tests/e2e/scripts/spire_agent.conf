agent {
    data_dir = "/opt/spire/data"
    log_level = "DEBUG"
    server_address = "spire-server"
    server_port = 8081
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "neural-hive.local"
    trust_bundle_path = "/opt/spire/data/bundle.crt"

    # SVID config
    default_svid_ttl = "1h"
    default_x509_svid_ttl = "24h"

    # Retry config
    connect_backoff = 1
    connect_timeout = 10
    max_backoff = 10
}

# Workload API config
plugins {
    NodeAttestor {
        plugin_data {
            cmd = "unix"
        }
    }

    KeyManager {
        plugin_data {
            directory = "/opt/spire/data/keys"
        }
    }

    WorkloadAttestor {
        plugin_data {
            cmd = "unix"
        }
    }

    WorkloadAPIServer {
        plugin_data {
            socket_path = "/run/spire/sockets/agent.sock"
        }
    }
}
