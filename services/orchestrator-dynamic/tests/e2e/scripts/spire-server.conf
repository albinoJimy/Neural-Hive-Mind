# Configuração do SPIRE Server para testes E2E
#
# Trust domain: neural-hive.local
# Data store: SQLite (in-memory para testes)

server {
    bind_address = "0.0.0.0"
    bind_port = 8081
    trust_domain = "neural-hive.local"
    data_dir = "/run/spire"
    log_level = "DEBUG"

    ca_key_type = "rsa-2048"

    sql {
        plugin_data {
            dialect = "sqlite3"
            source = "/run/spire/data/sqlite.db"
        }
    }

    // OIDC Discovery para JWT-SVID verification
    oidc {
        issuer = "https://neural-hive.local"
    }
}
