[pytest]
# Pytest configuration para testes E2E Vault+SPIFFE

# Python paths
pythonpath = . ../../../libraries/security ../../../libraries/domain

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e_real: Testes que requerem Vault/SPIRE reais
    e2e_mock: Testes que usam mocks
    vault: Testes específicos de Vault
    spiffe: Testes específicos de SPIFFE
    slow: Testes que demoram mais de 5 segundos
    integration: Testes de integração

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (opcional)
# addopts = --cov=src --cov-report=html --cov-report=term-missing

# Timeout (opcional - requer pytest-timeout)
# timeout = 300

# Minimizar diff output
console_output_style = progress

# Mostrar valores de variáveis locais em tracebacks
showlocals = False

# Continue após erro de importação (útil para debug)
# -x para parar no primeiro erro
# --maxfail=3 para parar após 3 erros
