[pytest]
# Pytest configuration for Execution Ticket Service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Default options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Coverage report (commentado para não rodar sempre)
    # --cov=src
    # --cov-report=term-missing
    # --cov-report=html
    # Asyncio mode
    --asyncio-mode=auto
    # Timeout for tests (5 min default)
    --timeout=300

# Markers for categorizing tests
markers =
    # Test types
    unit: Unit tests (isolated, fast)
    integration: Integration tests (external dependencies)
    e2e: End-to-end tests (full workflows)
    performance: Performance tests (measure throughput/latency)
    load: Load tests (high volume)
    slow: Slow tests (take > 1s)

    # Feature areas
    api: Tests for REST API endpoints
    grpc: Tests for gRPC service
    kafka: Tests for Kafka producer/consumer
    database: Tests for database operations
    webhook: Tests for webhook functionality
    workflow: Tests for ticket workflows

    # Special categories
    smoke: Smoke tests (critical path)
    regression: Regression tests (known bugs)
    flaky: Flaky tests (may fail intermittently)

# Minimum version
minversion = 8.0

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (when using --cov)
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */proto_gen/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
