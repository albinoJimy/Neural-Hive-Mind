replicaCount: 1

image:
  repository: queen-mcp-server
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3012

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  queenAgentHost: queen-agent
  queenAgentPort: 8006
  logLevel: INFO

nodeSelector: {}
tolerations: []
affinity: {}
