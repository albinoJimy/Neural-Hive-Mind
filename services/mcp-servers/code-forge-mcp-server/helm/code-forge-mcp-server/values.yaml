replicaCount: 1

image:
  repository: nhm/code-forge-mcp-server
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 3018

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

env:
  - name: CODE_FORGE_MCP_LOG_LEVEL
    value: INFO
  - name: CODE_FORGE_MCP_ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: anthropic-credentials
        key: api-key
  - name: CODE_FORGE_MCP_REDIS_URL
    value: redis://redis:6379/0

nodeSelector: {}
tolerations: []
affinity: {}
