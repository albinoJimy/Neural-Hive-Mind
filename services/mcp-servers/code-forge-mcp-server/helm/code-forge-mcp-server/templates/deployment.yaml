apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "code-forge-mcp-server.fullname" . }}
  labels:
    app: {{ include "code-forge-mcp-server.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "code-forge-mcp-server.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "code-forge-mcp-server.name" . }}
    spec:
      serviceAccountName: {{ include "code-forge-mcp-server.fullname" . }}
      containers:
      - name: code-forge-mcp-server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: mcp
        env:
        - name: CODE_FORGE_MCP_PORT
          value: "{{ .Values.service.port }}"
        {{- range .Values.env }}
        - name: {{ .name }}
          {{- if .value }}
          value: {{ .value | quote }}
          {{- else if .valueFrom }}
          valueFrom:
            secretKeyRef:
              name: {{ .valueFrom.secretKeyRef.name }}
              key: {{ .valueFrom.secretKeyRef.key }}
          {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
