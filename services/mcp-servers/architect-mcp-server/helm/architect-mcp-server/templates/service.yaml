apiVersion: v1
kind: Service
metadata:
  name: {{ include "architect-mcp-server.fullname" . }}
  labels:
    app: {{ include "architect-mcp-server.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: mcp
    protocol: TCP
    name: mcp
  selector:
    app: {{ include "architect-mcp-server.name" . }}
