replicaCount: 1

image:
  repository: nhm/healer-mcp-server
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 3019

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: HEALER_MCP_LOG_LEVEL
    value: INFO
  - name: HEALER_MCP_HEALER_AGENT_HOST
    value: self-healing-engine
  - name: HEALER_MCP_HEALER_AGENT_PORT
    value: "8009"

nodeSelector: {}
tolerations: []
affinity: {}
