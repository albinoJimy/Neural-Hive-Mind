replicaCount: 1

image:
  repository: worker-mcp-server
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3013

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  workerAgentHost: worker-agents
  workerAgentPort: 8005
  serviceRegistryHost: service-registry
  serviceRegistryPort: 8007
  logLevel: INFO

nodeSelector: {}
tolerations: []
affinity: {}
