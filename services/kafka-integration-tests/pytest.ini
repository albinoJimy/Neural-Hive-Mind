[pytest]
# Configurações do Pytest

# Diretórios de testes
testpaths = tests

# Padrões de arquivo
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Async
asyncio_mode = auto

# Timeout
timeout = 30

# Markers
markers =
    unit: Testes unitários (não dependem de infraestrutura)
    integration: Testes de integração (requerem Kafka)
    e2e: Testes de ponta a ponta (fluxo completo)
    slow: Testes que levam mais de 5 segundos
    kafka: Testes que requerem Kafka rodando
    redis: Testes que requerem Redis rodando
    mongodb: Testes que requerem MongoDB rodando

# Coverage
[coverage:run]
source = ../
omit =
    */tests/*
    */venv/*
    */.venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
