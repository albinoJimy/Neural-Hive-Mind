apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    app: {{ .Chart.Name }}
type: Opaque
stringData:
  jwt-secret-key: {{ .Values.secrets.jwt_secret_key | default "change-me-in-production" | quote }}
  mlflow-tracking-password: {{ .Values.secrets.mlflow_tracking_password | default "" | quote }}
  s3-access-key: {{ .Values.secrets.s3_access_key | default "" | quote }}
  s3-secret-key: {{ .Values.secrets.s3_secret_key | default "" | quote }}
