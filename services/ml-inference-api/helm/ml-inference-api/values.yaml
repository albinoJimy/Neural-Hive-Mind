replicaCount: 2

image:
  repository: ml-inference-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http: 8008
    metrics: 9098

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Environment variables
env:
  SERVICE_NAME: ml-inference-api
  SERVICE_VERSION: "1.0.0"
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  API_HOST: "0.0.0.0"
  API_PORT: "8008"
  # MLflow / Model Registry
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_MODEL_NAME: nhm_approval_model
  LOCAL_MODEL_PATH: /app/ml_models
  # Batch Inference
  BATCH_DEFAULT_SIZE: "10"
  BATCH_MAX_SIZE: "100"
  BATCH_TIMEOUT_SECONDS: "5.0"
  # Rate Limiting
  ENABLE_RATE_LIMITING: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  # GPU Configuration
  ENABLE_GPU: "false"
  GPU_MEMORY_FRACTION: "0.8"
  GPU_DEVICE_ID: "0"
  # Circuit Breaker
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT_SECONDS: "60"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT_SECONDS: "30"
  # Observabilidade
  OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
  PROMETHEUS_PORT: "9098"
  JAEGER_SAMPLING_RATE: "0.1"
  # CORS (JSON array format)
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
  # Security
  ENABLE_AUTH: "false"
  JWT_ALGORITHM: HS256

# Secrets (sensitive data)
secrets:
  jwt_secret_key: ""
  mlflow_tracking_password: ""
  s3_access_key: ""
  s3_secret_key: ""

# Optional GPU resources
gpuResources:
  enabled: false
  nvidiaComGpu: "1"

serviceAccount:
  create: true
  name: ml-inference-api

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ml-inference-api
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  hosts:
    - host: ml-inference.neural-hive.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
