# Deploy manifest for GDPR Erasure Service
# Kubernetes deployment following NHM patterns

apiVersion: v1
kind: ConfigMap
metadata:
  name: gdpr-erasure-config
  namespace: nhm-services
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  SERVICE_VERSION: "1.0.0"
  MONGODB_DATABASE: "nhmgdpr"
  REDIS_TOKEN_TTL: "3600"
  KAFKA_ERASURE_COMMANDS_TOPIC: "gdpr.erasure.commands"
  KAFKA_ERASURE_REPORTS_TOPIC: "gdpr.erasure.reports"
  ERASURE_RETENTION_DAYS: "90"
  CORS_ORIGINS: "https://app.neuralhive.ai,https://admin.neuralhive.ai"
---
apiVersion: v1
kind: Secret
metadata:
  name: gdpr-erasure-secrets
  namespace: nhm-services
type: Opaque
stringData:
  VERIFICATION_TOKEN_SALT: "${GDPR_TOKEN_SALT}"
  JWT_SECRET: "${GDPR_JWT_SECRET}"
  MONGODB_URL: "mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@mongodb-primary.nhm-infra.svc.cluster.local:27017,$(MONGODB_REPLICA_SET)"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis-master.nhm-infra.svc.cluster.local:6379/0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdpr-erasure-service
  namespace: nhm-services
  labels:
    app: gdpr-erasure
    component: service
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gdpr-erasure
  template:
    metadata:
      labels:
        app: gdpr-erasure
        component: service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8010"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: gdpr-erasure-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: gdpr-erasure
        image: ghcr.io/neural-hive-mind/gdpr-erasure-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8010
          protocol: TCP
        env:
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8010"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: LOG_LEVEL
        - name: SERVICE_VERSION
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: SERVICE_VERSION
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: gdpr-erasure-secrets
              key: MONGODB_URL
        - name: MONGODB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: MONGODB_DATABASE
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: gdpr-erasure-secrets
              key: REDIS_URL
        - name: REDIS_TOKEN_TTL
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: REDIS_TOKEN_TTL
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.nhm-infra.svc.cluster.local:9092"
        - name: KAFKA_ERASURE_COMMANDS_TOPIC
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: KAFKA_ERASURE_COMMANDS_TOPIC
        - name: KAFKA_ERASURE_REPORTS_TOPIC
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: KAFKA_ERASURE_REPORTS_TOPIC
        - name: VERIFICATION_TOKEN_SALT
          valueFrom:
            secretKeyRef:
              name: gdpr-erasure-secrets
              key: VERIFICATION_TOKEN_SALT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gdpr-erasure-secrets
              key: JWT_SECRET
        - name: ERASURE_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: ERASURE_RETENTION_DAYS
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: gdpr-erasure-config
              key: CORS_ORIGINS
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gdpr-erasure-service
  namespace: nhm-services
  labels:
    app: gdpr-erasure
    component: service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8010
    targetPort: http
    protocol: TCP
  selector:
    app: gdpr-erasure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gdpr-erasure-sa
  namespace: nhm-services
  annotations:
    eks.amazonaws.io/role-arn: arn:aws:iam::ACCOUNT_ID:role/gdpr-erasure-service-role
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gdpr-erasure-hpa
  namespace: nhm-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gdpr-erasure-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
# NetworkPolicy for GDPR service communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gdpr-erasure-netpol
  namespace: nhm-services
spec:
  podSelector:
    matchLabels:
      app: gdpr-erasure
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow HTTP traffic from ingress
  - from:
    - namespaceSelector:
        matchLabels:
          name: nhm-ingress
    ports:
    - protocol: TCP
      port: 8010
  # Allow traffic from within service mesh
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8010
  egress:
  # MongoDB
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
  # Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Kafka
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  # DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# PrometheusServiceMonitor for metrics scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gdpr-erasure-monitor
  namespace: nhm-services
  labels:
    app: gdpr-erasure
spec:
  selector:
    matchLabels:
      app: gdpr-erasure
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scheme: http
