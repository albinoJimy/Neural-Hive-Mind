version: '3.8'

# Docker Compose para GDPR Erasure Service
# Neural Hive-Mind - Right to Erasure (GDPR Artigo 17)
#
# Serviços:
# - gdpr-erasure-service (8010)
# - MongoDB (dados persistentes)
# - Redis (cache de tokens)
# - Kafka (mensageria)
# - Zookeeper (dependência Kafka)
#
# Uso:
#   docker-compose up -d
#   docker-compose logs -f gdpr-erasure-service
#   docker-compose down

services:
  # ========================================
  # GDPR ERASURE SERVICE
  # ========================================

  gdpr-erasure-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      # API
      - API_HOST=0.0.0.0
      - API_PORT=8010
      - ENVIRONMENT=development
      - LOG_LEVEL=info
      - SERVICE_VERSION=1.0.0

      # MongoDB
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=nhmgdpr

      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TOKEN_TTL=3600

      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ERASURE_COMMANDS_TOPIC=gdpr.erasure.commands
      - KAFKA_ERASURE_REPORTS_TOPIC=gdpr.erasure.reports

      # Security
      - VERIFICATION_TOKEN_SALT=nhm-erasure-salt-2024
      - JWT_SECRET=development-secret-change-in-production

      # Retention
      - ERASURE_RETENTION_DAYS=90

      # CORS
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000

    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - gdpr-net
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/api/v1/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  # ========================================
  # INFRAESTRUTURA
  # ========================================

  # MongoDB (persistent storage)
  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=nhmgdpr
    volumes:
      - mongodb-data:/data/db
      # Script para criar índices TTL
      - ./scripts/init-mongodb.js:/docker-entrypoint-initdb.d/01-init.js:ro
    networks:
      - gdpr-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (token cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - gdpr-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9093:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper
    networks:
      - gdpr-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2182:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - gdpr-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 3s
      retries: 3

# ========================================
# VOLUMES
# ========================================

volumes:
  mongodb-data:
  redis-data:

# ========================================
# NETWORKS
# ========================================

networks:
  gdpr-net:
    driver: bridge
