apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-ingestion
  namespace: neural-hive-mind
  labels:
    app: doc-ingestion
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-ingestion
  template:
    metadata:
      labels:
        app: doc-ingestion
        version: v1.0.0
    spec:
      containers:
      - name: doc-ingestion
        image: nhm/doc-ingestion:v1.0.0
        ports:
        - containerPort: 8018
          name: http
        env:
        - name: DOC_INGEST_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: DOC_INGEST_MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: mongodb-url
        - name: DOC_INGEST_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: bootstrap-servers
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8018
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8018
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: doc-ingestion
  namespace: neural-hive-mind
  labels:
    app: doc-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 8018
    targetPort: 8018
    name: http
  selector:
    app: doc-ingestion
