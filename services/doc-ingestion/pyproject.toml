[tool.poetry]
name = "doc-ingestion"
version = "0.1.0"
description = "Doc Ingestion Service for Neural Hive-Mind - Parse legacy documentation (PDF, Word, Visio, Postman)"
authors = ["Neural Hive-Mind Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
motor = "^3.3.2"
redis = {extras = ["hiredis"], version = "^5.0.1"}
aiokafka = "^0.9.0"
structlog = "^23.2.0"
openai = "^1.7.2"
anthropic = "^0.18.0"
python-multipart = "^0.0.6"

# PDF parsing
pypdf2 = "^3.0.1"
pdfplumber = "^0.10.3"

# Word parsing
python-docx = "^1.1.0"

# Visio/Excel/XML parsing
lxml = "^5.1.0"
openpyxl = "^3.1.2"

# Postman collection parsing
jsonschema = "^4.20.0"

# S3/MinIO storage
minio = "^7.2.0"
boto3 = "^1.34.0"

# Observabilidade
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"
opentelemetry-instrumentation-httpx = "^0.42b0"
opentelemetry-exporter-otlp = "^1.21.0"

# Neural Hive-Mind integration
neural-hive-integration = {path = "../../libraries/neural_hive_integration", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
ruff = "^0.1.8"
black = "^23.12.1"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
