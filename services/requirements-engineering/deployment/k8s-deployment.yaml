apiVersion: apps/v1
kind: Deployment
metadata:
  name: requirements-engineering
  namespace: neural-hive-mind
  labels:
    app: requirements-engineering
    version: v0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: requirements-engineering
  template:
    metadata:
      labels:
        app: requirements-engineering
        version: v0.1.0
    spec:
      containers:
      - name: requirements-engineering
        image: nhm/requirements-engineering:v0.1.0
        ports:
        - containerPort: 8010
          name: http
        env:
        - name: REQ_ENG_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secrets
              key: openai-api-key
        - name: REQ_ENG_MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: infrastructure-config
              key: mongodb-url
        - name: REQ_ENG_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: infrastructure-config
              key: kafka-servers
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8010
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: requirements-engineering
  namespace: neural-hive-mind
  labels:
    app: requirements-engineering
spec:
  type: ClusterIP
  ports:
  - port: 8010
    targetPort: 8010
    name: http
  selector:
    app: requirements-engineering
