[pytest]
minversion = 7.0
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test*

addopts =
    -v
    --tb=short
    --strict-markers
    --no-cov

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests

timeout = 300
log_cli = true
log_cli_level = INFO
