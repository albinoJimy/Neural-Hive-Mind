apiVersion: 1

providers:
  - name: 'Neural Hive Mind - Dashboards'
    orgId: 1
    folder: 'Neural Hive Mind'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
