[pytest]
# =============================================================================
# Neural Hive-Mind - Configuração Global do pytest
# =============================================================================
# Configuração centralizada para execução de testes em todo o projeto.
# Atualizado: 2026-03-29
# GAP-04: Cobertura de Testes 16% → 70%
# =============================================================================

# Mode asyncio para testes assíncronos
asyncio_mode = auto

# Diretórios de teste
testpaths =
    tests
    libraries/python/neural_hive_specialists/tests
    libraries/python/neural_hive_ml/tests
    libraries/python/neural_hive_security/tests
    services/*/tests

# Padrões de descoberta de arquivos
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configurações de输出
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Cobertura de código
addopts =
    --cov=libraries/python/neural_hive_specialists
    --cov=libraries/python/neural_hive_ml
    --cov=libraries/python/neural_hive_resilience
    --cov=libraries/python/neural_hive_risk_scoring
    --cov=libraries/python/neural_hive_agent_sdk
    --cov=libraries/python/neural_hive_observability
    --cov=libraries/python/neural_hive_security
    --cov=services
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=60

# Filtros de warnings
filterwarnings =
    # Ignorar avisos de depreciação conhecidos
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignorar warnings de bibliotecas de terceiros
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::pytest.PytestUnhandledCoroutineWarning

# Marcadores de teste
markers =
    unit: Marca testes unitários (isolados, sem dependências externas)
    integration: Marca testes de integração (com serviços reais ou containers)
    e2e: Marca testes ponta a ponta (fluxo completo)
    security: Marca testes relacionados à segurança
    auth: Marca testes de autenticação/autorização
    kafka: Marca testes que requerem Kafka
    grpc: Marca testes que requerem gRPC
    temporal: Marca testes que requerem Temporal
    slow: Marca testes lentos (para execução separada)
    skip_ci: Marca testes que devem ser pulados no CI

# Timeout padrão para testes
timeout = 300

# Mínimo de cobertura por módulo
# --cov-fail-under=60 configurado acima

# Logs
log_cli = true
log_cli_level = INFO

# Configuração de console
console_output_style = progress

# Opiniões de覆盖率
cov-report = html
cov-report = xml
cov-report = term-missing
