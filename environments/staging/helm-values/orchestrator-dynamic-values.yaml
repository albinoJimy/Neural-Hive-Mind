# Orchestrator Dynamic - Ambiente de Staging
# Configuracoes para validacao pre-producao

replicaCount: 2

config:
  environment: staging
  logLevel: INFO

  observability:
    otelEnabled: true
    otelExporterEndpoint: http://opentelemetry-collector.observability.svc.cluster.local:4317
    tracingSamplingRate: 0.5  # 50% em staging

  vault:
    enabled: true
    failOpen: false

  spiffe:
    enabled: false  # Desabilitado - servidor SPIRE não está rodando no cluster

# Password do Redis cluster (requirepass em redis-cluster-config = nhm_redis_2026).
# Sem esta entrada, o template secret.yaml usa o default '<sealed-secret-ref>' do
# values.yaml base (placeholder literal) — o orchestrator falha a auth no Redis,
# o mapeamento ticket->workflow nao e gravado/lido e o Fluxo C6 nao fecha.
# Staging nao tem sealed-secret a resolver; password ja exposta no configmap.
secrets:
  redisPassword: "nhm_redis_2026"

environment: staging
