# OPA Gatekeeper Helm Values - Production Environment
#
# IMPORTANTE (remediação P0 2026-06-04):
# Este ficheiro foi REESCRITO. A versão anterior usava chaves de TOPO
# (replicaCount, webhook, mutatingAdmissionWebhook, validatingAdmissionWebhook,
# autoEnforce, violationLog, backup, networkPolicy, alerting, etc.) que o
# subchart oficial `gatekeeper` NÃO lê — era config 100% morta e foi a causa
# do drift repo↔cluster (o repo "dizia" failurePolicy=Fail/auditInterval=300
# mas o cluster corria Ignore/60 porque nada chegava ao subchart).
#
# Todas as chaves abaixo são as chaves OFICIAIS do subchart, aninhadas sob
# `gatekeeper:`, e portanto efectivas via `helm upgrade -f <este ficheiro>`.

gatekeeper:
  # Alta disponibilidade em produção: `replicas` controla o controller-manager.
  # REMEDIAÇÃO P0: a chave `auditPodCount` NÃO existe no subchart oficial 3.22.0
  # (era config morta — o audit corre sempre como 1 pod). Foi removida.
  replicas: 3

  # Controller-manager: mantém 512Mi. Validado ao vivo que o uso real é ~94Mi e
  # que os 176 restarts eram liveness timeouts do mutating webhook (removido),
  # não OOM. 512Mi cabe na ResourceQuota security-quota do namespace (2Gi).
  controllerManager:
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 256Mi

  audit:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  # ---------------------------------------------------------------------------
  # AUDIT EFICIENTE — REMEDIAÇÃO P0
  # ---------------------------------------------------------------------------
  # auditFromCache=true: lê do informer cache em vez de martelar o apiserver.
  # auditMatchKindOnly=true: só audita kinds com constraints associadas.
  # auditInterval=300: reconcilia a intenção do repo (era 60 no cluster).
  auditFromCache: true
  auditMatchKindOnly: true
  auditInterval: 300
  constraintViolationsLimit: 50

  # IMPORTANTE (REMEDIAÇÃO P0): com auditFromCache=true o audit lê do informer
  # cache, logo o SyncConfig TEM de observar todos os kinds cobertos pelas
  # constraints (policies/constraints/), senão o audit perde violações. A antiga
  # chave `sync.syncOnly` em values NÃO existe no subchart oficial 3.22.0 (era
  # config morta) — o SyncConfig é um CRD separado (config.gatekeeper.sh/v1alpha1
  # Config) aplicado via kubectl. Ver k8s/bootstrap/gatekeeper-sync-config.yaml,
  # aplicado ANTES das policies pelo workflow.

  # Métricas e monitorização
  enableMetrics: true
  metricsBackends: ["prometheus"]

  # ---------------------------------------------------------------------------
  # WEBHOOK DE VALIDAÇÃO — failurePolicy=Fail (intenção do repo, agora efectiva)
  # ---------------------------------------------------------------------------
  validatingWebhookFailurePolicy: Fail
  validatingWebhookTimeoutSeconds: 3
  validatingWebhookExemptNamespacesLabels:
    kubernetes.io/metadata.name:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - cosign-system

  # ---------------------------------------------------------------------------
  # WEBHOOK DE MUTAÇÃO — REMEDIAÇÃO P0
  # ---------------------------------------------------------------------------
  # No subchart a mutação é controlada por `disableMutation` (default false =
  # LIGADA). Como NÃO existem mutators (Assign/AssignMetadata/...) no repo, o
  # MutatingWebhookConfiguration corria com rules catch-all "*" a intercetar
  # subjectaccessreviews/tokenreviews/leases/events e a esmagar o apiserver.
  # Desligamos a mutação por completo (elimina o webhook).
  disableMutation: true
  mutatingWebhookFailurePolicy: Ignore
  mutatingWebhookTimeoutSeconds: 3
  # Defesa em profundidade caso a mutação seja reactivada: substitui o "*".
  mutatingWebhookCustomRules:
    - apiGroups: ["", "apps", "batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources:
        - pods
        - deployments
        - statefulsets
        - daemonsets
        - replicasets
        - jobs
        - cronjobs
      scope: Namespaced
  mutatingWebhookExemptNamespacesLabels:
    kubernetes.io/metadata.name:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - cosign-system

  # Namespaces de sistema isentos de enforcement
  exemptNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - gatekeeper-system
    - cosign-system

  # Log level
  logLevel: INFO

  # Pod Disruption Budget para alta disponibilidade
  pdb:
    controllerManager:
      minAvailable: 2
