# Camada 1 (config, menor risco): aumentar réplicas no mesmo consumer group dá
# concorrência de consumo NATURAL — cada réplica fica dona de partições distintas
# do tópico plans.ready (6 partições), sem tocar na lógica de offset. Subido de
# 1→2 de forma conservadora. Pode subir até 6 (nº de partições) se o lag persistir
# e houver capacidade de memória (consensus: req 512Mi / limit 2Gi por réplica).
replicaCount: 2

image:
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

config:
  environment: dev
  logLevel: DEBUG

  kafka:
    bootstrapServers: "neural-hive-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    consumerGroupId: "consensus-engine-dev"
    plansTopicConsume: "plans.ready"
    consensusTopicProduce: "plans.consensus"
    securityProtocol: "PLAINTEXT"
    schemaRegistryUrl: "http://schema-registry.kafka.svc.cluster.local:8081/apis/ccompat/v6"

  # Camada 2 (código, feature-flag): concorrência intra-réplica. Default=1 mantém o
  # comportamento série atual (anti-regressão). Ativar (>1) SÓ após validar memória/CPU
  # e observar lag — preferir primeiro a Camada 1 (replicaCount acima).
  consumer:
    maxConcurrentPlans: 1

  specialists:
    # As chaves DEVEM ter o sufixo *Endpoint para corresponderem ao template do
    # configmap (helm-charts/consensus-engine/templates/configmap.yaml:29-33). Sem o
    # sufixo, o Helm resolve as variáveis SPECIALIST_*_ENDPOINT como string vazia e o
    # consensus-engine fica sem endpoints gRPC para os especialistas.
    businessEndpoint: "specialist-business.neural-hive.svc.cluster.local:50051"
    technicalEndpoint: "specialist-technical.neural-hive.svc.cluster.local:50051"
    behaviorEndpoint: "specialist-behavior.neural-hive.svc.cluster.local:50051"
    evolutionEndpoint: "specialist-evolution.neural-hive.svc.cluster.local:50051"
    architectureEndpoint: "specialist-architecture.neural-hive.svc.cluster.local:50051"
    # Especialistas demoram ~9-27s (inferência ML); 5s causa timeout e bloqueia o consenso.
    # Alinhado com o chart default (120000) e o configmap vivo validado em 2026-06-16.
    grpcTimeoutMs: 120000
    grpcMaxRetries: 3

  mongodb:
    uri: "mongodb://mongodb.mongodb-cluster.svc.cluster.local:27017"
    database: "neural_hive_dev"
    consensusCollection: "consensus_decisions"

  redis:
    clusterNodes: "neural-hive-cache.redis-cluster.svc.cluster.local:6379"
    sslEnabled: false
    pheromoneTtl: 3600
    pheromoneDecayRate: 0.1

  # A chave DEVE ser openTelemetry para corresponder ao template do configmap
  # (helm-charts/consensus-engine/templates/configmap.yaml:87-88). Com `otel:` o Helm
  # resolve OTEL_EXPORTER_OTLP_ENDPOINT como string vazia, desligando o tracing em dev.
  openTelemetry:
    endpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
    samplingRate: 1.0

  consensus:
    minConfidenceScore: 0.8
    maxDivergenceThreshold: 0.05
    highRiskThreshold: 0.7
    criticalRiskThreshold: 0.9
    bayesianPriorWeight: 0.1
    votingWeightDecay: 0.95
    requireUnanimousForCritical: true
    fallbackToDeterministic: true

  features:
    enableBayesianAveraging: true
    enablePheromones: true
    enableFallback: true
    enableParallelInvocation: true

  # Consenso Hierárquico (GAPS-03) — ativado explicitamente em dev.
  # Garante consensus_method_hierarchical=true e weighted_by_seniority=true,
  # com pesos diferenciados por senioridade (architecture=expert tem mais peso).
  hierarchical:
    enable: true
    defaultSeniorityLevel: "mid_level"
    specialistSeniority:
      business: "senior"
      technical: "senior"
      behavior: "mid_level"
      evolution: "mid_level"
      architecture: "expert"
    domainSpecialistWeights:
      business_BUSINESS: 0.25
      technical_TECHNICAL: 0.25
      architecture_ARCHITECTURE: 0.30

serviceMonitor:
  enabled: true
  interval: 60s

networkPolicy:
  enabled: true

environment: dev
