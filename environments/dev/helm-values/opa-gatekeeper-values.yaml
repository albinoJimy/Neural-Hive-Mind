# OPA Gatekeeper Helm Values - Development Environment

# Todas as configurações devem estar aninhadas sob a chave 'gatekeeper' para o subchart
gatekeeper:
  # Development replica configuration
  replicas: 1
  auditPodCount: 1

  # Resource limits optimized for development
  controllerManager:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  audit:
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  # Image configuration
  image:
    repository: openpolicyagent/gatekeeper
    release: ""  # Use chart's default
    pullPolicy: IfNotPresent

  # Development-specific constraint violation enforcement
  constraintViolationsLimit: 20
  # REMEDIAÇÃO P0: audit eficiente mesmo em dev para não martelar o etcd.
  auditInterval: 300
  auditMatchKindOnly: true
  auditFromCache: true

  # Metrics and monitoring
  enableMetrics: true
  metricsBackends: ["prometheus"]

  # Development webhook configuration
  validatingWebhookFailurePolicy: Ignore
  validatingWebhookName: gatekeeper-validating-webhook-configuration
  validatingWebhookTimeoutSeconds: 3
  validatingWebhookCheckIgnoreFailurePolicy: Ignore
  # REMEDIAÇÃO P0: removidas as chaves vazias `validatingWebhookCustomRules: {}`
  # e `validatingWebhookExemptNamespacesLabels: {}` — sobrepunham os defaults do
  # chart com objectos vazios, podendo remover exemptions já configuradas e
  # levar o webhook a validar namespaces de sistema. Usam-se agora os defaults
  # do chart (a isenção de namespaces de sistema é feita via `namespaceSelector`
  # mais abaixo neste ficheiro).

  # Mutating webhook (disabled in dev for simplicity)
  # REMEDIAÇÃO P0: a chave correcta do subchart é `disableMutation` (não
  # `enableMutation`, que é config morta). disableMutation=true elimina o
  # MutatingWebhookConfiguration catch-all "*" que sufocava o apiserver.
  disableMutation: true
  mutatingWebhookFailurePolicy: Ignore
  mutatingWebhookReinvocationPolicy: Never
  mutatingWebhookTimeoutSeconds: 3
  # Defesa em profundidade: se a mutação for reactivada, restringe o scope.
  mutatingWebhookCustomRules:
    - apiGroups: ["", "apps", "batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources:
        - pods
        - deployments
        - statefulsets
        - daemonsets
        - replicasets
        - jobs
        - cronjobs
      scope: Namespaced
  mutatingWebhookExemptNamespacesLabels:
    kubernetes.io/metadata.name:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system

  # Node selection for development
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 999
    runAsNonRoot: true
    runAsUser: 1000

  # Pod security context
  podSecurityContext:
    fsGroup: 999
    supplementalGroups:
    - 999

  # Development-specific exemptions
  disabledBuiltins: []

  # Enable OPA built-in functions
  enableExternalData: false
  enableGeneratorResourceExpansion: true
  enableTLSHealthcheck: false

  # Log level
  logLevel: DEBUG
  logMutations: true

  # Namespace exclusions
  exemptNamespaces: []
  exemptNamespaceLabels: []

  # Webhook namespace selector
  namespaceSelector:
    matchExpressions:
    - key: admission.gatekeeper.sh/ignore
      operator: DoesNotExist
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - kube-public
      - opa-gatekeeper
      - gatekeeper-system