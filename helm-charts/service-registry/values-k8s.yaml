# Kubernetes values for service-registry
# Neural Hive-Mind - Production/Kubernetes deployment
# Override values for Kubernetes environments

# Re-enabled 2026-05-18: imagem ghcr.io/.../service-registry:c762d89 verificada
# como funcional no cluster. Bloqueio anterior era um secret `service-registry-secret`
# com chave `redis-password` vazia; agora o chart suporta `existingSecretKey` para
# apontar para o secret partilhado `redis-password` (chave `password`).
# service-registry é dependência crítica do orchestrator-dynamic intelligent_scheduler.
replicaCount: 1

# Sourcing do password de Redis a partir do secret partilhado em vez de gerar
# vazio. O secret `redis-password` no namespace neural-hive contém a chave
# `password` com a credencial real.
config:
  redis:
    existingSecret: "redis-password"
    existingSecretKey: "password"
  environment: "production"
  logLevel: "INFO"
  debug: false

image:
  repository: ghcr.io/albinojimy/neural-hive-mind/service-registry
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false

serviceAccount:
  create: false
  name: default

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  fsGroup: 1001
  runAsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false
  runAsNonRoot: true

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

serviceMonitor:
  enabled: false

# Observabilidade - OpenTelemetry habilitado em Kubernetes
observability:
  otelEnabled: true
  otelEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
  tracing:
    enabled: true

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false

istio:
  enabled: false
