apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pii-service.secretName" . }}
  labels:
    {{- include "pii-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MongoDB URI (INV-13: audit logging persistence)
  MONGODB_URI: {{ .Values.secrets.mongodbUri | quote }}

  # Encryption key (INV-14: AES-256-GCM unmask reversível)
  # Empty string -> serviço tenta Vault; senão gera chave temporária.
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}

  # JWT secret (apenas se JWKS_URL não for configurado)
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # Vault credentials (opcional)
  VAULT_ADDR: {{ .Values.secrets.vaultAddr | quote }}
  VAULT_TOKEN: {{ .Values.secrets.vaultToken | quote }}

  # JWKS URL (opcional, alternativa a JWT_SECRET)
  JWKS_URL: {{ .Values.secrets.jwksUrl | quote }}
