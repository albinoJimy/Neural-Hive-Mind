apiVersion: v1
kind: Service
metadata:
  name: {{ include "pii-service.fullname" . }}
  labels:
    {{- include "pii-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pii-service.selectorLabels" . | nindent 4 }}
  # Os nomes têm de respeitar o manifest k8s/ original (8021=http, 9021=grpc).
  ports:
  - name: http
    port: {{ .Values.service.httpPort }}
    targetPort: http
    protocol: TCP
  - name: grpc
    port: {{ .Values.service.grpcPort }}
    targetPort: grpc
    protocol: TCP
