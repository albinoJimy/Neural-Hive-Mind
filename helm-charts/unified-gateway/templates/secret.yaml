apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unified-gateway.secretName" . }}
  labels:
    {{- include "unified-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # Credenciais Redis (rate limiting / cache)
  # ---------------------------------------------------------------------------
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}

  # ---------------------------------------------------------------------------
  # Credenciais MongoDB (persistência operacional)
  # ---------------------------------------------------------------------------
  MONGODB_USERNAME: {{ .Values.secrets.mongodbUsername | quote }}
  MONGODB_PASSWORD: {{ .Values.secrets.mongodbPassword | quote }}

  # ---------------------------------------------------------------------------
  # Segredo JWT (assinatura/validação de tokens)
  # ---------------------------------------------------------------------------
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
