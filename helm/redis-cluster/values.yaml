redis:
  enabled: true

  cluster:
    enabled: true
    nodes: 6
    replicas: 3

  image:
    repository: redis
    tag: 7.2.4-alpine

  auth:
    enabled: true
    password: null
    existingSecret: redis-password

  tls:
    enabled: true
    authClients: true
    autoGenerated: false
    certificatesSecret: redis-server-tls
    caCertificateFile: ca.crt
    certificateFile: tls.crt
    keyFile: tls.key

  persistence:
    enabled: true
    storageClass: "longhorn"

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi