gatekeeper:
  replicas: 2
  auditPodCount: 1

  controllerManager:
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi

  audit:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  enableMetrics: true
  metricsBackends: ["prometheus"]

  validatingWebhookFailurePolicy: Fail
  validatingWebhookTimeoutSeconds: 3
  mutatingWebhookFailurePolicy: Ignore
  mutatingWebhookTimeoutSeconds: 3

  # REMEDIAÇÃO P0: `enableMutatingWebhook` não existe no subchart (config
  # morta). Desligar a mutação por completo via `disableMutation` (não há
  # mutators no cluster) elimina o MutatingWebhookConfiguration catch-all "*".
  disableMutation: true

  # Audit eficiente para não martelar o etcd em modo enforcement.
  auditFromCache: true
  auditMatchKindOnly: true
  auditInterval: 300